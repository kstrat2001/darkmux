         pointed at them, so /next had no tab favicon and could not be
         installed to a phone home screen (no manifest link) or added with a
         real icon on iOS (no apple-touch-icon). -->

    <!-- (the flip, #1800) The four metas that make an iOS home-screen
         shortcut open CHROMELESS. The links above are enough to install a
         shortcut with a real icon; without these it opens inside Safari's
         browser chrome instead of as an app, which is the whole point of the
         operator's phone dashboard.

         by `html_shells_declare_standalone_app`, which asserts this exact set
         and which the flip had to REPOINT at the served document. -->
