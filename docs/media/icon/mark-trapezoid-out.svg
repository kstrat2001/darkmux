<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="dm-s2-grad" x1="14" y1="10" x2="40" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
  </defs>
  <!-- Two inputs, one output: the smallest arrangement that still SAYS
       multiplexer rather than just "a shape". The full mark's four channels
       do not survive this size, but the relation many-in/one-out does, and
       that relation is the whole idea.

       Spaced 20 units apart, not 14. Closer together they merged into a
       double stroke below 32px instead of reading as two channels — and two
       channels IS the message. 20 also lands symmetric inside the
       trapezoid's 42-unit left edge (11 units clear above and below). -->
  <path d="M3 22 L14 22" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" />
  <path d="M3 42 L14 42" stroke="#c084fc" stroke-width="4.5" stroke-linecap="round" />
  <path d="M14 11 L40 23 L40 41 L14 53 Z"
        fill="rgba(129,140,248,0.18)"
        stroke="url(#dm-s2-grad)" stroke-width="5"
        stroke-linejoin="round" stroke-linecap="round" />
  <path d="M40 32 L58 32" stroke="#2dd4bf" stroke-width="5" stroke-linecap="round" />
</svg>
