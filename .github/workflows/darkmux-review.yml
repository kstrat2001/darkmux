# darkmux self-review — darkmux reviews its own PRs, in public, on a local
# crew of models.
#
# darkmux dogfooding itself: a PR diff is dispatched to the **review pipeline**
# (`templates/builtin/mission-configs/review.json`, #1284/#1513) — an explicit
# task graph declaring probe/judge/verify TASKS, each carrying its own
# `role_id`. Staffing is resolved on the runner from the `role_profiles` map
# in the runner's own `~/.darkmux/config.json` (#1475) — this workflow names
# no models and no profile; it only supplies the diff/source params below.
# The probe tasks surface findings, the judge double-confirms them, and
# verify renders the final adjudication — running on a self-hosted runner.
# No cloud API is involved. The findings post back as native inline PR
# comments.
#
# SECURITY (public repo + self-hosted runner): the trigger is **workflow_dispatch
# only** — it never fires on a `pull_request` event, so a stranger's PR (or a
# fork) can NOT auto-run anything on the runner. Only someone with write access
# launches it (`gh workflow run darkmux-review.yml -f pr=<n>`), and even then the
# job NEVER checks out the reviewed PR's code: it reads only the PR *diff* via
# the API (data, not executed) and feeds it to the sandboxed, network-isolated
# internal runtime. The review pipeline's `github` input (inside the `darkmux
# mission launch review` dispatch below) fetches changed-file + one-hop-import
# CONTENTS via the same GitHub API — also read as data and never executed,
# the same trust class as the diff. The repo checkout below is of trusted
# `main` (the review tooling), not the PR. Runner registration + prerequisites:
# see .github/DARKMUX_REVIEW_RUNNER.md.
name: darkmux self-review

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to review"
        required: true
        type: string
      mode:
        description: "Review dispatch mode: sequential (one seat model loaded at a time — the 32GB-tier default), parallel (multiple seat models resident at once), or auto (darkmux picks)."
        required: false
        default: "auto"
        type: string

concurrency:
  group: darkmux-review-${{ inputs.pr }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: [self-hosted, darkmux-review]
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ inputs.pr }}
      REPO: ${{ github.repository }}
      MODE: ${{ inputs.mode }}
    steps:
      - name: Checkout review tooling (trusted main — NOT the reviewed PR)
        uses: actions/checkout@v4
        with:
          # (#1359) checkout's default `clean: true` runs `git clean -ffdx`,
          # whose -x deletes gitignored files — including target/ — so every
          # run would pay a cold full-workspace release build in the
          # binary-rebuild step below. `clean: false` keeps target/ warm
          # between runs (incremental rebuild, ~20s measured vs multi-minute
          # cold). Safe HERE specifically because this checkout is
          # trusted-main-only by design (see the header): no untrusted ref
          # ever lands in this tree, so stale-artifact poisoning from PR
          # code isn't a vector. Tracked files still hard-sync to the
          # dispatch ref on every run.
          clean: false
        # Brings the review/posting script from this repo at the dispatch ref
        # (main). The reviewed PR's code is never checked out — only its diff
        # (and, inside the review dispatch, individual file contents via the
        # API) are read — so untrusted PR code never lands on the runner.

      - name: Build the darkmux binary (trusted main checkout — #1359)
        run: |
          set -euo pipefail
          # #1359: without this step the dispatch below fell through to
          # whatever `darkmux` happened to be on the runner's PATH — in
          # practice ~/.cargo/bin/darkmux from whatever `cargo install
          # --path .` a maintainer last ran by hand. That binary silently
          # drifts behind main; confirmed live 2026-07-13, when two review
          # runs dispatched with a binary several merges stale (predating
          # the #1230 Mission/Task/Step wiring): no tokens or mission in
          # the viewer, a retired record vocabulary in the flow stream,
          # and long-fixed template bugs reappearing in the posted
          # comment — all burning real diagnosis time before the stale
          # binary was identified. Building here, from the SAME
          # trusted-main checkout this workflow already ran the review
          # tooling from, guarantees the dispatch always runs the code
          # this workflow actually checked out.
          #
          # Built to a workflow-local path ($GITHUB_WORKSPACE/target/release)
          # rather than `cargo install --path .` into the runner's global
          # ~/.cargo/bin: the runner is also a developer machine, and this
          # workflow has no business silently overwriting whatever binary
          # the operator has manually installed there for their own use.
          # The dispatch step below invokes this build's explicit path
          # instead of relying on PATH resolution.
          #
          # Cost: with `clean: false` on the checkout above keeping
          # target/ warm, this is an incremental build (~20s measured on
          # the runner) after the first run; only a fresh runner or a
          # manual clean pays the multi-minute cold build, well inside
          # this job's 90-minute budget.
          cargo build --release --locked
          echo "DARKMUX_BIN=$PWD/target/release/darkmux" >> "$GITHUB_ENV"
          "$PWD/target/release/darkmux" --version

      - name: Fetch PR diff + head SHA (API only — no PR checkout, no code execution)
        id: diff
        run: |
          set -euo pipefail
          # Defense-in-depth: the `pr` input is maintainer-supplied, but pin it to
          # digits so only a valid PR number ever reaches the gh/API calls below.
          case "$PR" in ''|*[!0-9]*) echo "pr input must be a number"; exit 1 ;; esac
          mkdir -p "$RUNNER_TEMP/qa"
          # The review dispatch (below) reads this FULL diff directly — it caps
          # what it sends to each seat's model internally (the same 80KB model
          # budget the old single-reviewer prompt used) while keeping the full
          # diff on disk for anchor-line resolution when rendering the review.
          gh pr diff "$PR" --repo "$REPO" > "$RUNNER_TEMP/qa/pr.diff"
          if [ -s "$RUNNER_TEMP/qa/pr.diff" ]; then
            echo "has_diff=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_diff=false" >> "$GITHUB_OUTPUT"
          fi
          HEAD_SHA=$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq .headRefOid)
          # Whole-string bash match, NOT line-anchored grep: grep -Eq '^...$'
          # matches per LINE, so a multiline value with one valid-looking line
          # would slip through; [[ =~ ]] anchors against the entire value.
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::bad head sha from gh pr view"; exit 1; }
          echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"

      - name: Write PR intent (title + description — prompt assembly lives in the binary)
        if: steps.diff.outputs.has_diff == 'true'
        run: |
          set -euo pipefail
          # #1053: a reviewer that doesn't know the change's INTENT flags the
          # very bug the PR fixes (the "restate-the-fix" false positive). The
          # review binary now assembles each seat's prompt itself (rubric +
          # intent + diff); this step's only job is handing it the author's
          # stated intent as plain data — NO AI in the loop here, just a `gh`
          # fetch, so it stays within the runner's no-LLM-API constraint.
          PRTITLE=$(gh pr view "$PR" --repo "$REPO" --json title --jq .title)
          PRBODY=$(gh pr view "$PR" --repo "$REPO" --json body --jq '.body // ""')
          # Cap for the model's context budget via a bash substring, NOT `| head`:
          # under `set -o pipefail`, head closing the pipe early would SIGPIPE gh
          # (141) and abort the step on any body over the cap.
          PRBODY="${PRBODY:0:8000}"
          {
            printf '%s\n' "$PRTITLE"
            echo
            if [ -n "$PRBODY" ]; then
              printf '%s\n' "$PRBODY"
            else
              echo "(no description provided)"
            fi
          } > "$RUNNER_TEMP/qa/intent.txt"

      - name: darkmux PR-review dispatch (local crew — no LLM API)
        if: steps.diff.outputs.has_diff == 'true'
        run: |
          set -euo pipefail
          # Defense-in-depth: `mode` is maintainer-supplied (workflow_dispatch
          # is maintainer-only), but constrain it to a known enum before it
          # reaches the dispatch args.
          case "$MODE" in sequential|parallel|auto) ;; *) echo "mode input must be one of: sequential, parallel, auto"; exit 1 ;; esac
          # Staffing lives on the MACHINE, not in this public workflow
          # (#1475, #1513): the review config declares explicit probe/judge/
          # verify TASKS, each carrying its own `role_id`; each role resolves
          # via the runner's `role_profiles` map in `~/.darkmux/config.json`
          # (falling back to `default_profile`). This workflow names no
          # model and no profile — it only supplies the diff/source params
          # below.
          #
          # Resilient: a hiccup leaves no/empty envelope; the review dispatch's own
          # degraded-mode handling (below) turns that into a loud comment plus
          # a failed run rather than a silent green check.
          # (#2310 P4d) `review` reads `diff_file` directly — there is no
          # bundler stage in this pipeline any more (the funnel that had
          # one was deleted), so darkmux reviewing its own Rust PRs no
          # longer depends on a reference plugin to avoid a degenerate
          # 0-bundle run.
          #
          # Invoked via the explicit $DARKMUX_BIN path built above (#1359),
          # NOT a bare `darkmux` PATH lookup — guarantees this dispatch runs
          # the binary built from this run's own trusted-main checkout, not
          # whatever install happens to sit on the runner's PATH.
          #
          # (#1284 Packet 4b) `pr-review run` retired into `mission launch
          # review` — every old CLI flag maps one-to-one onto a `--param
          # key=value` input declared in templates/builtin/mission-configs/
          # review.json; see that config's own `inputs` doc for the mapping
          # table. `--timeout` is the ONE exception: it stayed the generic
          # `mission launch` CLI flag every config-launched dispatch shares,
          # rather than becoming its own `--param`.
          "$DARKMUX_BIN" mission launch review \
            --param "github=$REPO" \
            --param "head_sha=$HEAD_SHA" \
            --param "diff_file=$RUNNER_TEMP/qa/pr.diff" \
            --param "intent_file=$RUNNER_TEMP/qa/intent.txt" \
            --param "mode=$MODE" \
            --param "envelope_out=$RUNNER_TEMP/qa/envelope.json" \
            --param "emit=$RUNNER_TEMP/qa/rendered.json" \
            --timeout 3600 || true

      # (#1583) The step name promised a summary fallback that did not exist
      # for the `review` mode: a 422 on the inline anchors killed the step
      # under `set -e` and discarded the whole run. The fallback is real now.
      - name: Post the review (inline comments, or summary fallback)
        if: steps.diff.outputs.has_diff == 'true'
        run: |
          set -euo pipefail
          if [ ! -s "$RUNNER_TEMP/qa/rendered.json" ]; then
            # The dispatch above never wrote a rendered payload at all (e.g. it
            # crashed before its own degraded-mode fallback could run). Same
            # "never read as a green check" contract as mode=degraded (#1113).
            gh pr comment "$PR" --repo "$REPO" --body \
              ":warning: darkmux PR review produced no output (mode=\`$MODE\`) — see workflow logs."
            echo "::error::review dispatch produced no rendered payload"
            exit 1
          fi
          # Post a formal review (inline comments), falling back to a
          # summary comment when the branch moved during the run or GitHub
          # rejected the inline anchors. A real shell function, not
          # copy-pasted prose: this whole step is ONE `run: |` bash script
          # (#1876/#1877 QA follow-up — a prior version of this file had the
          # `review)` and `partial)` cases below duplicate this ~35-line
          # dance by hand, justified by a comment claiming the file "has no
          # function/include mechanism"; a function defined here is
          # available to every `case` arm in this same script). Reads
          # $RUNNER_TEMP/qa/review.json (the formal review payload) and
          # $RUNNER_TEMP/qa/fallback.md (the summary fallback text) — the
          # caller writes both before calling this.
          post_review_or_fallback() {
            # (#1583) A review takes tens of minutes, so the branch moving
            # under it is NORMAL. If HEAD moved since the diff was taken,
            # the inline anchors point at lines that no longer exist —
            # skip straight to the summary rather than spending a
            # guaranteed-422 API call to learn that.
            # `|| HEAD_NOW=""` is load-bearing: under `set -e` a failing
            # command substitution in an assignment kills the STEP, which
            # would make one transient 502 on this extra call discard a
            # review that is already rendered and valid on disk — exactly
            # the failure class this branch exists to remove, reintroduced
            # by the guard against it.
            HEAD_NOW=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha) || HEAD_NOW=""
            POSTED=""
            # An UNKNOWN head is not a moved head. When the probe fails we
            # attempt the inline post anyway — the 422 path below already
            # covers a genuinely-moved branch, whereas treating unknown as
            # moved would skip a post that would have succeeded and print a
            # note claiming a SHA transition that was never observed.
            if [ -n "$HEAD_NOW" ] && [ "$HEAD_NOW" != "$HEAD_SHA" ]; then
              echo "::warning::branch moved during the review ($HEAD_SHA -> $HEAD_NOW) — posting the summary, inline anchors would not resolve"
              REASON="the branch moved while the review was running (\`${HEAD_SHA:0:7}\` → \`${HEAD_NOW:0:7}\`), so the findings could not be anchored to diff lines"
            elif gh api "repos/$REPO/pulls/$PR/reviews" --input "$RUNNER_TEMP/qa/review.json" \
                   2> "$RUNNER_TEMP/qa/post.err"; then
              POSTED="review"
            else
              echo "::warning::inline review rejected — falling back to a summary comment"
              sed -n '1,20p' "$RUNNER_TEMP/qa/post.err" || true
              # Backticks are stripped along with newlines: gh's own 422 text
              # contains them ("thread `line` must be part of the diff"), and
              # nesting them inside a code span breaks the rendered note.
              REASON="GitHub rejected the inline comments (\`$(tr -d '\n`' < "$RUNNER_TEMP/qa/post.err" | cut -c1-200)\`)"
            fi

            # The findings are the product. Losing them to a posting error
            # is the one outcome this function exists to prevent — a
            # summary-only post is a DEGRADED SUCCESS, so it returns 0 and
            # only a failure of BOTH paths is fatal.
            if [ -z "$POSTED" ]; then
              if [ ! -s "$RUNNER_TEMP/qa/fallback.md" ] || [ "$(cat "$RUNNER_TEMP/qa/fallback.md")" = "null" ]; then
                echo "::error::inline review failed and no summary fallback was rendered"
                exit 1
              fi
              { printf '> [!NOTE]\n> Posted as a summary rather than inline comments: %s.\n\n' "$REASON"
                cat "$RUNNER_TEMP/qa/fallback.md"
              } > "$RUNNER_TEMP/qa/fallback-final.md"
              gh pr comment "$PR" --repo "$REPO" --body-file "$RUNNER_TEMP/qa/fallback-final.md"
            fi
          }
          MODE_RESULT=$(jq -r .mode "$RUNNER_TEMP/qa/rendered.json")
          case "$MODE_RESULT" in
            review)
              jq .review "$RUNNER_TEMP/qa/rendered.json" > "$RUNNER_TEMP/qa/review.json"
              jq -r .comment "$RUNNER_TEMP/qa/rendered.json" > "$RUNNER_TEMP/qa/fallback.md"
              post_review_or_fallback ;;
            partial)
              # (#1876/#1877) The judge stage did not rule on every flag (its
              # remote token budget exhausted before the docket finished),
              # but everything it DID rule on is real, posted signal — the
              # payload here is the SAME shape `review` (a formal review, with
              # inline comments) or `comment` (no confirmed findings, just
              # prose) would build, plus a banner naming the shortfall. Post
              # it exactly like those modes would — via the SAME
              # `post_review_or_fallback` function the `review)` case above
              # calls — but FAIL the run afterward regardless of which path
              # posted: an incomplete review must never read as a clean,
              # green pass, even though its judged portion is genuine signal.
              # This is deliberately its own case rather than folded into
              # `review)`/`comment)` above — those two stay byte-identical to
              # their pre-#1876 behavior (posted content AND exit code), and
              # this new failure-after-posting behavior stays visibly scoped
              # to the one mode that actually has a coverage gap to report.
              if [ "$(jq -r '.review // "null"' "$RUNNER_TEMP/qa/rendered.json")" = "null" ]; then
                # No confirmed findings this run (needs-check only, or
                # nothing at all) — no formal review payload, post the
                # comment the way `comment` mode does.
                jq -r .comment "$RUNNER_TEMP/qa/rendered.json" > "$RUNNER_TEMP/qa/comment.md"
                gh pr comment "$PR" --repo "$REPO" --body-file "$RUNNER_TEMP/qa/comment.md"
              else
                jq .review "$RUNNER_TEMP/qa/rendered.json" > "$RUNNER_TEMP/qa/review.json"
                jq -r .comment "$RUNNER_TEMP/qa/rendered.json" > "$RUNNER_TEMP/qa/fallback.md"
                post_review_or_fallback
              fi
              echo "::error::review coverage was incomplete (mode=partial) — see the posted findings above; some flags never got a ruling"
              exit 1 ;;
            degraded)
              # (#1113) NO review signal (dead dispatch / empty reply /
              # vacuous pass). Post the honest note, then FAIL this run —
              # a produced-nothing review must never read as a green check.
              jq -r .comment "$RUNNER_TEMP/qa/rendered.json" > "$RUNNER_TEMP/qa/comment.md"
              gh pr comment "$PR" --repo "$REPO" --body-file "$RUNNER_TEMP/qa/comment.md"
              echo "::error::review dispatch produced no usable review (mode=degraded)"
              exit 1 ;;
            noop)
              # (#1605) A genuinely non-code diff (every touched file
              # declined for a benign reason, per the envelope's
              # `bundle_skip` breakdown) — post the neutral note and exit 0.
              # Distinct from `degraded`: this is an honest "nothing here",
              # never a failure, and never a green approval either.
              jq -r .comment "$RUNNER_TEMP/qa/rendered.json" > "$RUNNER_TEMP/qa/comment.md"
              gh pr comment "$PR" --repo "$REPO" --body-file "$RUNNER_TEMP/qa/comment.md" ;;
            comment)
              # Zero confirmed findings (needs-check only, or nothing at
              # all) — no formal review payload, just the honest prose
              # summary. A real signal-bearing outcome, so post and exit 0.
              jq -r .comment "$RUNNER_TEMP/qa/rendered.json" > "$RUNNER_TEMP/qa/comment.md"
              gh pr comment "$PR" --repo "$REPO" --body-file "$RUNNER_TEMP/qa/comment.md" ;;
            *)
              # (#1889) An unrecognized `Rendered.mode` must fail loudly,
              # never fall through to a silent post-and-pass — the same
              # "a produced-nothing review must never read as a green
              # check" doctrine the `degraded)` arm above states explicitly.
              echo "::error::unrecognized rendered mode: $MODE_RESULT"
              exit 1 ;;
          esac

      - name: Upload review envelope (debugging + audit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-envelope
          path: ${{ runner.temp }}/qa/envelope.json
          if-no-files-found: ignore
          retention-days: 14
