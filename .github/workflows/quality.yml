name: quality

# (#1635) Two checks the ordinary suite structurally cannot make about ITSELF.
#
# `cargo test` answers "does the code do what the tests say". It cannot answer
# "do the tests say anything" — a test that passes against a broken
# implementation is indistinguishable from one that passes against a correct
# one, and on 2026-08-04 SIX tests written in a single day passed or failed for
# a reason other than the one they named. Every one was caught by hand, by
# reverting the fix underneath it. This automates that.
#
#   mutation — flips a comparison, deletes a branch, replaces a return value.
#              A mutant that SURVIVES is a line no test constrains.
#   coverage — reports which lines executed at all. Three defects that shipped
#              (#1618, #1631, and the ghost-runs half of #1621) lived in regions
#              with literally zero test execution.
#
# Both are ADVISORY ABOUT THEIR FINDINGS: a surviving mutant or an uncovered
# region surfaces a number and a diff and never blocks a merge. Making those a
# gate before anyone has seen their baseline would fail honest PRs for
# pre-existing debt.
#
# (#1716) Both are GATING ON THEIR OWN INTEGRITY, and that is a different
# claim. If the tool did not actually run — or ran and reported numbers that
# contradict its own exit code — the job FAILS. It had been doing the
# opposite: `cargo mutants ... || true` swallowed every exit code, so a run
# where the baseline suite failed and zero mutants were ever generated
# rendered "No surviving mutants" and went green. An advisory check is still
# allowed to say nothing; it is not allowed to say "clean" when it never ran.
#
# (#2550) A CANCELLED run is the same class of lie, from a different cause.
# A large diff can outrun `mutants-in-diff`'s `timeout-minutes` budget while
# a mutation invocation is mid-run — the job's conclusion becomes
# `cancelled`, distinct from both `success` and `failure`, and
# `cargo mutants` never gets to write an exit code. At the time of the real
# incident (run 34324045744, PR head `386afc48`, 2026-09-09) the "Report
# survivors" step for that invocation was ALREADY gated on `if: always()` —
# it DID run, with conclusion `failure` — but the summary script treated the
# resulting empty `exit_code` as a bare parse error and printed its message
# to **stderr** before exiting 2, so nothing ever reached
# `$GITHUB_STEP_SUMMARY` and that scope's section of the PR summary was
# simply ABSENT. Advisory-plus-cancelled then read, on the PR page, almost
# identically to advisory-plus-clean: nothing distinguished "we looked and
# found nothing" from "we never finished looking". (A day later, an
# unrelated fix — #2602 — put these same Report steps on `!cancelled()`,
# which really would skip a step outright on job cancellation; that is a
# separate, real hole, not the one that produced the original incident.)
# Each Report step below stays on `always()` (its own Mutate step stays on
# `!cancelled()` — a new multi-minute mutation run must not START once
# cancellation is already underway) and passes `--job-status "${{
# job.status }}"` to the summary script, which now renders a loud, distinct
# CANCELLED verdict (with whatever partial progress cargo-mutants had
# already written) instead of erroring to stderr. See
# `scripts/ci-mutants-summary.py`'s own `CANCELLED_SENTINEL`.

on:
  pull_request:
    branches: [main]
  # (#1792) Coverage also runs on main so the README badge reflects MAIN,
  # not whichever PR happened to publish last. The mutation jobs stay
  # PR/schedule-only — they are gated on their own `if:` below.
  push:
    branches: [main]
  schedule:
    # Nightly sweep. Originally root-package-only (`cargo mutants --list`
    # found 2,176 mutants at that scope, 2026-09-09) — the ~12 crates under
    # `crates/` were never covered because an unsharded run there could not
    # finish (see `mutants-full`'s own comment for the measured numbers and
    # the #2499 fix). As of that fix this cron now drives a SHARDED sweep of
    # the whole workspace (`mutants-full`'s 21-shard matrix + the small-crate
    # job `mutants-full-small`, 13,636 mutants total, 2026-09-15 census) —
    # not just the root package. The PR job (`mutants-in-diff`, #2499's
    # earlier half) mutates `--workspace` too, but scoped to the diff, which
    # is far smaller and whose baseline is scoped to only the touched
    # packages — a different, already-cheap problem from this one.
    - cron: "23 7 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  mutants-in-diff:
    name: mutation — tests that cannot fail (PR diff only)
    runs-on: macos-latest
    if: github.event_name == 'pull_request'
    # (#2499) 30 -> 45: the Mutate step's `--timeout` went 120 -> 300 (a
    # larger per-mutant/baseline ceiling), so a slow mutant or a bigger diff
    # needs more job-level headroom to match.
    #
    # (#2544) 45 -> 60: two more SEQUENTIAL invocations were added below
    # (runtime/, plugins/darkmux-bundler-rust/), each with its own baseline.
    # Measured on an M5 Max (faster than macos-latest, same caveat #2499's
    # own numbers carry): `runtime/`'s baseline is ~70s (13-19s build + 55s
    # test — it re-runs the crate's whole 667-test suite per mutant, same as
    # any single-package cargo-mutants baseline) and its mutant-testing
    # throughput on a real sample (21 mutants, `src/compaction.rs`) was
    # ~17s/mutant amortized under `-j 4`.
    #
    # (#2602) That 17s/mutant figure is a LOCAL rate on the fastest hardware
    # in play, and citing it here understates the real ceiling: frontier
    # review independently sampled a DIFFERENT runtime file and measured
    # ~21s/mutant, still on local hardware — one file alone already beats
    # the 17s figure before the CI runner is even accounted for. Applying
    # the SAME macos-latest-vs-M5-Max ratio the nightly sweep's own
    # measurement already establishes below (~21.4s/mutant real CI rate vs
    # ~17s/mutant local sample, ~1.26x) to that more conservative 21s/mutant
    # local sample projects a real CI rate of roughly 26-27s/mutant. A heavy
    # runtime-touching diff on the order of `src/compaction.rs`'s own full
    # mutant count (126) would then cost roughly 126×26.5s ≈ 56 minutes of
    # mutant testing alone, plus its own ~70s baseline — call it ~55-57
    # minutes total, which is not merely "can exceed" this job's 60-minute
    # budget, it consumes essentially the ENTIRE budget by itself, on a
    # SINGLE file — the same per-invocation version of the large-diff
    # timeout #2550 already documents for the root invocation.
    # `plugins/darkmux-bundler-rust/` is comparatively free (baseline ~6s,
    # ~0.8s/mutant amortized — a 28-mutant sample completed in 29s total).
    #
    # Two things keep this from being pure downside on every PR, not one:
    # first, a PR touching NEITHER `runtime/` nor
    # `plugins/darkmux-bundler-rust/` (the common case) pays ZERO extra
    # minutes for either — both "Mutate ... only what this PR touched"
    # steps below are skipped outright (`if: steps.diff.outputs.*_changed_
    # lines != '0'`), and the matching "Note ... skipped" step just writes
    # one line to the summary. Second, the ROOT invocation's own "Report
    # survivors" step runs and posts to the job summary BEFORE either added
    # invocation starts — so even a `runtime/`-touching diff big enough to
    # burn the whole remaining budget (and time out) still leaves the root
    # finding recorded, not lost with the rest of the job.
    #
    # 60 minutes gives real headroom for a TYPICAL diff (the common case
    # touches far less than a whole file); sharding either invocation the
    # way #2499/#2550 already call for is the real fix for a genuinely
    # large one, and is explicitly NOT attempted
    # here — see the `mutants-full` job's own comment for why a full sweep
    # of `runtime/` specifically needs that before it can run at all.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # `--in-diff` needs the merge base to compute the changed lines.
          fetch-depth: 0

      - name: Install Rust stable toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          key: mutants

      - name: Install cargo-mutants
        # (#1716) PINNED. Unpinned, CI installs whatever is current, and this
        # job's entire pass/fail decision is read out of cargo-mutants' exit
        # codes and its `outcomes.json` field names. A rename in either turns
        # the gate back into a false green — which is not hypothetical: an
        # `outcomes.json` carrying none of the keys we read was the exact
        # fixture that made the summary print "nothing to mutate" at exit 2
        # over three real survivors. The summary script now falls back to the
        # `.txt` files and cross-checks the exit code, so a rename degrades
        # loudly rather than silently; the pin is what keeps the upgrade a
        # deliberate, reviewed act. Bump both install sites together.
        run: cargo install cargo-mutants --locked --version 27.1.0

      - name: Summary script self-test
        # The whole pass/fail decision for this job lives in a Python file the
        # repo's own mutation gate structurally cannot cover. Same wiring as
        # `engagement-sentinel-guard.py --self-test` in ci.yml: the self-test
        # runs FIRST, so a broken summarizer fails here instead of quietly
        # mis-reporting a real sweep.
        run: python3 scripts/ci-mutants-summary.py --self-test

      - name: Diff against the merge base
        id: diff
        run: |
          # What cargo-mutants gets. Unchanged: every Rust file in the diff.
          git diff "origin/${{ github.base_ref }}"...HEAD -- '*.rs' > /tmp/pr.diff
          echo "changed Rust lines (all): $(grep -cE '^\+([^+]|$)' /tmp/pr.diff || true)"

          # (#1716) What the summary step asserts on, and it is deliberately a
          # NARROWER number: the added Rust lines that are actually IN SCOPE for
          # this job's mutation run.
          #
          # The summary fails the job when cargo-mutants mutated nothing while
          # the diff added Rust code — the PROVEN-green shape behind an
          # `--in-diff` whose paths don't resolve ("No mutants to filter", exit
          # 0) and an unparseable diff ("Diff file is empty", exit 0). That
          # assertion is only sound if the count and the mutation scope agree.
          #
          # (#2499) WIDENED to '*.rs': the Mutate step below now passes
          # `--workspace`, so the mutation scope is the whole tree, not just
          # the root `darkmux` package — a PR touching only `crates/**` now
          # gets real coverage instead of the old "No mutants to filter"
          # silent green, and this counter has to widen with it (this was
          # previously 'src/*.rs' — see the capitalized comment that used to
          # sit here — or a `crates/`-only PR would trip this floor for a
          # defect that was already documented and merely deferred, not
          # legitimate). A git pathspec's `*` crosses `/` (confirmed locally:
          # `git diff -- '*.rs'` matches a `crates/**/*.rs` change; `git diff
          # -- 'src/*.rs'` does not), so this covers any nesting.
          #
          # ADDED lines only, and not the `+++ b/path` file headers: a
          # deletion-only diff legitimately yields zero mutants, and counting
          # its header line would turn that into a failure.
          #
          # The count comes from the summary script, NOT from a `grep -c` here,
          # for two reasons. First, `^\+([^+]|$)` counts every added line —
          # including comments and attributes, which are Rust lines that
          # legitimately produce no mutants. PR #2514 (12 doc-comment lines and
          # one `#[serial_test::serial]`) failed this gate on exactly that. The
          # script's `added_line_is_countable` throws those away and documents
          # what it still gets wrong. Second, logic that decides pass/fail
          # belongs where `--self-test` can reach it; untested gate logic in a
          # workflow's shell is the shape #1716 was about, relocated.
          #
          # Written to a file first, deliberately: in a `git ... | grep -c`
          # pipeline (no pipefail under GitHub's `bash -e`) a FAILING git diff
          # feeds grep nothing, grep prints 0, and the guard silently switches
          # itself off. As a plain command, a git failure fails the step — and
          # the counter likewise exits non-zero rather than printing 0 if it
          # cannot read the diff.
          # (#2544) `--manifest-path Cargo.toml` scopes this count to what the
          # ROOT-workspace invocation below can actually reach. Before this,
          # the floor counted every added Rust line regardless of path — so a
          # diff entirely under `runtime/` (which the root manifest's own
          # `[workspace] exclude` keeps structurally out of `--workspace`'s
          # reach, see that comment) counted as real, uncovered code, the
          # Mutate step legitimately reported zero mutants, and rule 3 below
          # read that as the under-scoping defect it exists to catch — failing
          # an honest PR. Proven on #2599 (a diff entirely under `runtime/`):
          # 511 added lines, 120 "countable" by the OLD unscoped counter,
          # against zero mutants from a run that structurally could not reach
          # any of them. `runtime/`'s own share is counted and mutated
          # SEPARATELY below — this floor is the workspace invocation's own,
          # not "every reachable line everywhere".
          git diff "origin/${{ github.base_ref }}"...HEAD -- '*.rs' > /tmp/pr-scope.diff

          # (#2605) The authoritative source, asked once per invocation
          # BEFORE the floor is computed: `cargo mutants --list --json`,
          # with NO `--in-diff` (see `ci-mutants-summary.py`'s own module
          # comment, above `added_line_is_countable`, for why omitting
          # `--in-diff` here is what keeps this independent of the exact
          # circularity that sank the earlier `--list --in-diff` idea). It
          # enumerates every file this invocation's manifest and flags
          # could EVER produce a mutant for, so the floor can recognize a
          # file whose only gate is a `#[cfg(test)]` `mod` DECLARATION in a
          # DIFFERENT file (#2599's shape) as unmutable, the same way
          # cargo-mutants' own source visitor already does — a per-file
          # text scan structurally cannot resolve a cross-file attribute.
          #
          # Same flags as the root Mutate step below (`--workspace`, no
          # `--manifest-path` — see that step's own comment for why root
          # never passes one: cargo-mutants 27.1.0 errors `"" is not a
          # directory` on a bare `--manifest-path Cargo.toml`, confirmed
          # locally, #2605). Measured cost (cargo-mutants 27.1.0, this
          # tree, 2026-09-10): ~10s wall, 13,037 mutants across 185 files —
          # parse-only, no build, no test, negligible against this job's
          # 60-minute budget. Failure here is FAIL-OPEN: if `--list` itself
          # fails (a real tool problem, which the identically-flagged
          # Mutate step below is then very likely to also hit on its own
          # terms), `--mutants-list` is simply not passed to the counter —
          # the counter's own docstring on `count_changed_lines_main` names
          # this as the deliberate workflow-side fail-open path, so a
          # broken listing narrows nothing rather than narrowing every PR's
          # floor to zero. Still loud: a `::warning::` annotation, not a
          # silently swallowed failure.
          #
          # (#2606 also-fix) Gated on `/tmp/pr-scope.diff` actually having
          # content: a ~10s `cargo mutants --list` sweep on a PR that touches
          # no `.rs` file at all (this very change's own PR, #2606, is one —
          # a workflow YAML and a Python script) bought nothing, and a
          # broken tool on such a PR would have spent the same 10s to then
          # emit a warning about a listing nobody needed.
          MUTLIST_ROOT_FLAG=()
          if [ -s /tmp/pr-scope.diff ]; then
            if cargo mutants --workspace --list --json > /tmp/mutlist-root.json 2>/tmp/mutlist-root.err; then
              MUTLIST_ROOT_FLAG=(--mutants-list /tmp/mutlist-root.json)
            else
              echo "::warning::cargo mutants --workspace --list --json failed — the #2605 listing-based floor narrowing is skipped for the root invocation this run (falling back to the heuristic alone); see the job log below:"
              cat /tmp/mutlist-root.err
            fi
          else
            echo "(#2606) no changed .rs file anywhere in this PR — skipping the #2605 listing call for the root invocation (nothing for it to narrow)"
          fi

          CHANGED=$(python3 scripts/ci-mutants-summary.py --count-changed-lines /tmp/pr-scope.diff --manifest-path Cargo.toml "${MUTLIST_ROOT_FLAG[@]}")
          echo "changed Rust lines (in workspace mutation scope, mutable-looking only): $CHANGED"
          echo "changed_lines=$CHANGED" >> "$GITHUB_OUTPUT"

          # (#2544) The SECOND invocation's own floor: `runtime/` is its own
          # standalone Cargo workspace (see `runtime/Cargo.toml`'s own
          # comment) deliberately excluded from the root's `[workspace]`, so
          # nothing above can ever see it — this counts the SAME diff against
          # `runtime/Cargo.toml`'s own (empty) exclude list instead, which is
          # the mirror image: everything under `runtime/` is reachable here,
          # everything outside it is not. Reused from the same
          # `/tmp/pr-scope.diff` (repo-root-relative paths) rather than a
          # second `git diff` — the manifest-path exclusion, not the diff
          # itself, is what changes between the two counts.
          # (#2605) Same mechanism, this invocation's own manifest — see the
          # root block above for the full rationale. Measured cost: ~1.7s
          # wall, 1,529 mutants across 18 files. This is the invocation
          # #2599 actually broke: `runtime/src/budget_request_tests.rs` and
          # `runtime/src/checkpoint_regression_tests.rs`, both real files
          # already in this tree, are each declared with `#[cfg(test)]
          # #[path = "..."] mod ...;` in a SIBLING file and carry no
          # `#[cfg(test)]` of their own — confirmed absent from this
          # listing's own output.
          #
          # (#2606 also-fix) The actual `--in-diff` file the runtime
          # invocation's Mutate step needs below, computed HERE — moved
          # ahead of its old position (right before the bundler block) —
          # so the listing call just below can gate on it. cargo-mutants
          # matches `--in-diff` paths against the SOURCE TREE IT WALKED FOR
          # THAT MANIFEST — for `--manifest-path runtime/Cargo.toml` that
          # tree is rooted at `runtime/` itself, so it lists (and matches)
          # mutants under paths like `src/foo.rs`, NOT `runtime/src/foo.rs`.
          # Confirmed locally: the repo-root-relative form silently matched
          # nothing ("No mutants to filter", exit 0) — the exact
          # false-clean shape this whole gate exists to catch — against a
          # diff that genuinely added a real, uncovered mutant;
          # `--relative=runtime` (paths relative to that directory, git's
          # own flag for this) is what actually matched. `/tmp/pr-scope.diff`
          # above stays repo-root-relative on purpose — it is what the
          # manifest-path exclusion logic (and the root invocation) expects.
          git diff "origin/${{ github.base_ref }}"...HEAD --relative=runtime -- 'runtime/*.rs' > /tmp/pr-runtime.diff

          # (#2606 also-fix) Gated on `/tmp/pr-runtime.diff` actually having
          # content — same rationale as the root block's own gate above,
          # scoped to `runtime/` specifically rather than "any .rs anywhere":
          # a PR that changes Rust elsewhere but not under `runtime/` still
          # has no business paying this invocation's own ~1.7s `--list`
          # sweep.
          MUTLIST_RUNTIME_FLAG=()
          if [ -s /tmp/pr-runtime.diff ]; then
            if cargo mutants --manifest-path runtime/Cargo.toml --list --json > /tmp/mutlist-runtime.json 2>/tmp/mutlist-runtime.err; then
              MUTLIST_RUNTIME_FLAG=(--mutants-list /tmp/mutlist-runtime.json)
            else
              echo "::warning::cargo mutants --manifest-path runtime/Cargo.toml --list --json failed — the #2605 listing-based floor narrowing is skipped for the runtime/ invocation this run (falling back to the heuristic alone); see the job log below:"
              cat /tmp/mutlist-runtime.err
            fi
          else
            echo "(#2606) no changed .rs file under runtime/ in this PR — skipping the #2605 listing call for the runtime/ invocation (nothing for it to narrow)"
          fi

          RUNTIME_CHANGED=$(python3 scripts/ci-mutants-summary.py --count-changed-lines /tmp/pr-scope.diff --manifest-path runtime/Cargo.toml "${MUTLIST_RUNTIME_FLAG[@]}")
          echo "changed Rust lines (in runtime/ mutation scope, mutable-looking only): $RUNTIME_CHANGED"
          echo "runtime_changed_lines=$RUNTIME_CHANGED" >> "$GITHUB_OUTPUT"

          # (#2544) THE THIRD invocation's own floor, same shape again:
          # `plugins/darkmux-bundler-rust` is ALSO its own standalone Cargo
          # workspace (see the root manifest's own comment on why — a
          # genuinely independent project proving the public `--bundler`
          # JSON contract is sufficient on its own, deliberately with zero
          # darkmux-* dependencies and zero privileged path-dependency
          # access). It is the one of the three deliberately-excluded
          # projects this issue decided TO cover, not just document: it is a
          # real cross-process wire contract (the class this whole
          # machinery exists for), and it is small (a full `--list` sweep
          # measures 224 mutants, baseline test suite ~0.5s), so a
          # diff-scoped run on it costs almost nothing. `tools/darkmux-mock-model`
          # (the fourth) is deliberately NOT covered — it is dev/test
          # infrastructure the way a `#[cfg(test)]` item already is (see the
          # module comment on `count_added_lines` in the summary script for
          # why that class is excluded from the floor already); its own
          # correctness is exercised by whatever integration test depends on
          # it, not by mutating its internals.
          # (#2605) Same mechanism again. Measured cost: ~0.2s wall, 224
          # mutants across 5 files — this manifest's own baseline test
          # suite already runs in well under a second, so the listing call
          # is noise on top of noise.
          #
          # (#2606 also-fix) Same reordering as the runtime block above:
          # this invocation's own `--in-diff` file, computed HERE (moved
          # ahead of its old position after the count below) so the listing
          # call can gate on it — a PR that never touches
          # `plugins/darkmux-bundler-rust/` has no business paying even
          # this manifest's ~0.2s `--list` sweep, small as it is.
          git diff "origin/${{ github.base_ref }}"...HEAD --relative=plugins/darkmux-bundler-rust -- 'plugins/darkmux-bundler-rust/*.rs' > /tmp/pr-bundler.diff

          MUTLIST_BUNDLER_FLAG=()
          if [ -s /tmp/pr-bundler.diff ]; then
            if cargo mutants --manifest-path plugins/darkmux-bundler-rust/Cargo.toml --list --json > /tmp/mutlist-bundler.json 2>/tmp/mutlist-bundler.err; then
              MUTLIST_BUNDLER_FLAG=(--mutants-list /tmp/mutlist-bundler.json)
            else
              echo "::warning::cargo mutants --manifest-path plugins/darkmux-bundler-rust/Cargo.toml --list --json failed — the #2605 listing-based floor narrowing is skipped for the bundler invocation this run (falling back to the heuristic alone); see the job log below:"
              cat /tmp/mutlist-bundler.err
            fi
          else
            echo "(#2606) no changed .rs file under plugins/darkmux-bundler-rust/ in this PR — skipping the #2605 listing call for the bundler invocation (nothing for it to narrow)"
          fi

          BUNDLER_CHANGED=$(python3 scripts/ci-mutants-summary.py --count-changed-lines /tmp/pr-scope.diff --manifest-path plugins/darkmux-bundler-rust/Cargo.toml "${MUTLIST_BUNDLER_FLAG[@]}")
          echo "changed Rust lines (in plugins/darkmux-bundler-rust/ mutation scope, mutable-looking only): $BUNDLER_CHANGED"
          echo "bundler_changed_lines=$BUNDLER_CHANGED" >> "$GITHUB_OUTPUT"

      - name: Mutate only what this PR touched
        id: mutants
        # (#2602 round 3) `!cancelled()`, matching "Report survivors" below
        # (and the runtime/ and plugins/darkmux-bundler-rust/ pairs further
        # down): this step previously had no condition at all, which is an
        # IMPLICIT `success()` gate — on any earlier step's failure this step
        # skips while "Report survivors" (`always()` below, now `!cancelled()`)
        # still runs and reads an empty `steps.mutants.outputs.exit_code`,
        # the exact drift the round-2 fix's own comment says must never
        # happen between a Mutate/Report pair. The round-2 fix put the two
        # OTHER pairs into lockstep on `!cancelled()` and left this, the
        # ROOT pair, on the primitive it discarded. An empty exit_code is now
        # honest (see the summary script's own empty-exit_code message)
        # rather than a raw integer-parse crash, so this was mitigated, not a
        # gate hole — but the pair was still out of lockstep.
        if: ${{ !cancelled() }}
        run: |
          # (#1716) No more `|| true`. That swallowed EVERY exit code,
          # including 4 (BaselineFailed — the unmutated tree's own tests
          # failed, so zero mutants were ever tested) indistinguishably from
          # 0 (clean) or 2 (survivors found, this job's entire point). Capture
          # the real code and hand the decision to the "Report survivors"
          # step, which is the one place that now owns pass/fail.
          #
          # `--copy-vcs true` is the actual fix for the baseline failure this
          # issue documents: cargo-mutants tests a COPY of the tree, and
          # without the VCS dirs that copy isn't a git repository, so any
          # test that shells out to git (this repo has two, both gated on
          # `darkmux mission launch coder-phase` needing a real repo) panics
          # before a single mutant is generated. Confirmed locally (see the
          # PR) by running those two tests against a copy with and without
          # `.git` — fails both ways without it, passes both ways with it.
          #
          # (#2499) FIXED: `--workspace` added below. This repo's root
          # `Cargo.toml` carries BOTH a `[workspace]` table AND a `[package]`
          # (the `darkmux` bin), so cargo-mutants' auto package-filter — the
          # same convention cargo itself uses — resolved to the ROOT package
          # only when no `-p`/`--workspace` was given. Measured 2026-09-08: a
          # diff touching only `crates/darkmux-eureka/src/lib.rs` produced "No
          # mutants to filter" at root scope and 5 real mutants with
          # `--workspace`. Re-confirmed locally 2026-09-09 (2 mutants for a
          # smaller synthetic one-function diff, 0 without the flag): every
          # one of the ~12 library crates under `crates/` got ZERO
          # mutation-in-diff coverage for as long as this job existed, and a
          # PR touching only `crates/**` passed this job green having tested
          # nothing.
          #
          # This is the SAFE half of the workspace-scope widening (the
          # `mutants-full` nightly's Sweep step is NOT changed — see its
          # comment for why): `Lab::run_baseline` (cargo-mutants
          # 27.1.0, src/lab.rs) scopes the baseline to
          # `PackageSelection::Explicit(all_mutated_packages)` — only the
          # packages that actually contain a mutant from this diff, not the
          # whole workspace — so a PR touching one small crate still gets a
          # small, fast baseline. Confirmed locally 2026-09-09: a diff
          # touching only `darkmux-eureka` ran its baseline in 1s test time
          # (vs the multi-hundred-second whole-workspace baseline the nightly
          # would face), and the 2-mutant sweep for it completed in 17s total.
          #
          # `--timeout` RAISED 120 -> 300. `--timeout` bounds BOTH the
          # baseline test phase and every mutant's test phase (cargo-mutants
          # has no separate baseline timeout — confirmed by reading
          # `Timeouts::for_baseline` in src/timeouts.rs, which reuses
          # `options.test_timeout` verbatim). The 120s figure was already
          # thin at root-only scope: two real PR-diff runs against root
          # measured the baseline TEST phase (not build, which is unbounded
          # during baseline) at 95s and 96s — see runs 34283477510 and
          # 34256702344 on kstrat2001/darkmux, both root-only, both "Found 64
          # mutants to test". Under `--workspace`, a PR that touches root
          # `src/*.rs` AND a crate (say `darkmux-crew`, whose own suite ran
          # 35s locally) stacks both packages' tests into ONE baseline test
          # phase — measured locally 2026-09-09: darkmux-crew alone runs its
          # unit tests in ~35s. Combined with root's ~95-96s that leaves
          # single-digit percent headroom under 120s on a slower CI runner,
          # for the single most common PR shape (touching both). 300s gives
          # real margin without materially slowing typical mutants (most
          # fail fast either way; a genuinely-hanging mutant now takes longer
          # to be classified TIMEOUT instead of falsely tanking the baseline).
          #
          # `timeout-minutes` on this job RAISED 30 -> 45 to match: a larger
          # per-mutant ceiling means a legitimately slow mutant (or a PR with
          # many changed lines) needs more job-level headroom too.
          set +e
          cargo mutants --workspace --in-diff /tmp/pr.diff -j 4 --timeout 300 \
            --copy-vcs true --output mutants-out
          STATUS=$?
          set -e
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Report survivors
        # (#2550) This step was ALREADY on `always()` at the time of the
        # real incident (run 34324045744, PR head `386afc48`, 2026-09-09) —
        # it ran, with conclusion `failure`. The actual mechanism was in the
        # summary script: `${{ steps.mutants.outputs.exit_code }}` arrives
        # empty when "Mutate only what this PR touched" above is cancelled
        # (this job's own `timeout-minutes` budget running out, most likely
        # — a manual cancel can also cause it) mid-run, and the script's old
        # handling of an empty `exit_code` printed its message to **stderr**
        # and exited 2 before any Markdown reached stdout — so nothing was
        # ever appended to `$GITHUB_STEP_SUMMARY` and the root scope's
        # section was simply ABSENT: indistinguishable, on the PR page, from
        # a clean sweep. (A day after the incident, an unrelated fix —
        # #2602 — briefly put this step on `!cancelled()`, which really
        # would skip it outright on cancellation; that was a separate, real
        # hole, not the cause of the original incident, and this fix reverts
        # it back to `always()`.) "Mutate only what this PR touched" above
        # stays on `!cancelled()` on purpose — it must NOT start a brand-new
        # multi-minute mutation run once cancellation is already underway;
        # only the (cheap, read-only) reporting step needs the wider gate.
        #
        # `--job-status "${{ job.status }}"` lets the summary script tell
        # "this invocation was cut off by cancellation" (job.status ==
        # cancelled, exit_code empty) apart from "an earlier unrelated step
        # failed" (job.status == failure, exit_code also empty) — only the
        # former gets the loud, distinct CANCELLED report instead of the old
        # stderr-only error; see ci-mutants-summary.py's own
        # `CANCELLED_SENTINEL`.
        if: ${{ always() }}
        run: |
          python3 scripts/ci-mutants-summary.py \
            "${{ steps.mutants.outputs.exit_code }}" diff \
            "Mutation testing — this PR's changed lines" \
            --changed-lines "${{ steps.diff.outputs.changed_lines }}" \
            --job-status "${{ job.status }}" \
            mutants-out/mutants.out mutants.out >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-in-diff
          path: |
            mutants-out/**
            mutants.out/**
          if-no-files-found: ignore

      # (#2544) The SECOND invocation, against `runtime/Cargo.toml`'s own
      # manifest — see the comment on `runtime_changed_lines` above for why
      # the root invocation above can never reach this crate. Skipped
      # entirely when the diff touches no mutable line under `runtime/`
      # (the common case): cargo-mutants' own baseline build+test on this
      # crate costs real minutes even when it finds nothing to filter
      # afterward (measured locally: ~70s build+test before a single mutant
      # runs), and this job's PR-diff budget is already tight (#2550: a
      # large diff can exhaust the whole 45-minute ceiling on the root
      # invocation alone). Paying that baseline cost on every PR regardless
      # of whether it touched `runtime/` would make an already-tight budget
      # worse for no signal.
      #
      # (#2602) `always() &&` added: without it, GitHub's implicit success
      # gate skips this step the moment an earlier step in the job fails
      # (e.g. the root "Mutate"/"Report survivors" steps above) — but
      # "Report survivors (runtime/)" below already carries its own
      # `always()` (it must, to report a failed root run at all) and reads
      # `steps.mutants_runtime.outputs.exit_code`.
      #
      # (#2602 round 2) `always()` -> `!cancelled()`: `always()` means "run
      # unconditionally, including when the job is CANCELLED" — not merely
      # "run even if an earlier step failed", which is `!cancelled()`'s own
      # actual meaning. Under the old `always()`, a cancelled run still
      # dispatched this invocation's full baseline-plus-mutation pass (the
      # same job whose own comment above says a single file can consume the
      # whole 60-minute budget) for a result nobody would ever read.
      # `!cancelled()` keeps the original intent — this invocation is
      # independent of the root one and should still run if root failed —
      # while actually honoring a cancellation. "Report survivors (runtime/)"
      # below carries the identical `!cancelled()` so the two steps can never
      # drift out of lockstep and reproduce the empty-`exit_code` integer-
      # parse error the original `always()` fix was closing.
      - name: Mutate runtime/ only what this PR touched
        id: mutants_runtime
        if: ${{ !cancelled() && steps.diff.outputs.runtime_changed_lines != '0' }}
        run: |
          # Same exit-code capture discipline as the root invocation above —
          # no `|| true`, the real code goes to the "Report survivors
          # (runtime/)" step, which owns this invocation's pass/fail exactly
          # the way "Report survivors" owns the root one.
          #
          # `--manifest-path runtime/Cargo.toml` (not `-C runtime` / `--dir`)
          # is what makes cargo-mutants treat `runtime/` as its OWN workspace
          # root for both mutant discovery and its `--copy-vcs` tree copy —
          # confirmed locally via cargo-mutants' own debug log
          # (`copy_tree: paths: ["<repo>/runtime"]`): the copy contains ONLY
          # `runtime/`, nothing above it. Two of this crate's own tests read
          # a fixture one directory up (`../tests/fixtures/...`, shared with
          # `crates/darkmux-crew` on the host side) and failed the baseline
          # under that copy for exactly that reason before #2544 vendored a
          # read-only copy into `runtime/tests/fixtures/` (see
          # `tests/runtime_fixtures_in_sync.rs` for the drift guard) — this
          # comment is here so the next person who sees a `runtime/`-only
          # `BaselineFailed` checks for the SAME class of cross-boundary path
          # first, not just re-derives it from scratch.
          #
          # `-j 4 --timeout 300 --copy-vcs true` mirror the root invocation's
          # own settings and reasoning above (per-mutant/baseline ceiling,
          # VCS copy for git-shelling-out tests) — `runtime/` has none of its
          # own that shell out to git, but the flag is harmless and keeping
          # both invocations' flags identical is one fewer thing to explain
          # differently later.
          set +e
          cargo mutants --manifest-path runtime/Cargo.toml --in-diff /tmp/pr-runtime.diff -j 4 --timeout 300 \
            --copy-vcs true --output mutants-runtime-out
          STATUS=$?
          set -e
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Report survivors (runtime/)
        # (#2550) `!cancelled()` -> `always()`, matching "Report survivors"
        # (root)'s own change above — see that step's comment for the full
        # rationale. Kept in lockstep with its OWN Mutate step, which stays
        # on `!cancelled()` for the same reason root's does: don't start a
        # brand-new baseline+mutation run once the job is already being
        # cancelled. `--job-status` added for the same reason as root's.
        if: ${{ always() && steps.diff.outputs.runtime_changed_lines != '0' }}
        run: |
          python3 scripts/ci-mutants-summary.py \
            "${{ steps.mutants_runtime.outputs.exit_code }}" diff \
            "Mutation testing — this PR's changed lines (runtime/)" \
            --changed-lines "${{ steps.diff.outputs.runtime_changed_lines }}" \
            --job-status "${{ job.status }}" \
            mutants-runtime-out/mutants.out mutants-runtime.out >> "$GITHUB_STEP_SUMMARY"

      # The mirror of the step above, for the common case where this PR
      # never touched `runtime/` at all — so the summary always says
      # something about `runtime/` coverage rather than silently omitting
      # it, which would read identically to "we looked and found nothing"
      # (the same illegibility #2550 named for a cancelled sweep).
      #
      # (#2550) `always() &&` added to this note's own condition too: it had
      # no status-check function at all before, which is an IMPLICIT
      # `success()` gate — on a job cancelled elsewhere (root's own Mutate
      # step, say) this note would silently vanish for a scope that never
      # had anything to report in the first place (no diff under `runtime/`
      # regardless of cancellation), leaving the summary looking incomplete
      # for a reason unrelated to the actual finding. `always()` keeps this
      # scope's section present no matter where else in the job a
      # cancellation lands.
      - name: Note runtime/ mutation was skipped (nothing to mutate there)
        if: ${{ always() && steps.diff.outputs.runtime_changed_lines == '0' }}
        run: |
          {
            echo "## Mutation testing — this PR's changed lines (runtime/)"
            echo ""
            echo "Skipped — no added Rust line under \`runtime/\` could plausibly produce a mutant."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-in-diff-runtime
          path: |
            mutants-runtime-out/**
            mutants-runtime.out/**
          if-no-files-found: ignore

      # (#2544) THE THIRD invocation — see the comment on `bundler_changed_lines`
      # above for why this project, specifically, was chosen to cover rather
      # than just document. Same shape as the runtime block above throughout,
      # including the (#2602 round 2) `!cancelled()` — see that condition's
      # comment on `mutants_runtime` for why `always()` (which also runs on a
      # CANCELLED job, not merely "an earlier step failed") was replaced.
      - name: Mutate plugins/darkmux-bundler-rust/ only what this PR touched
        id: mutants_bundler
        if: ${{ !cancelled() && steps.diff.outputs.bundler_changed_lines != '0' }}
        run: |
          set +e
          cargo mutants --manifest-path plugins/darkmux-bundler-rust/Cargo.toml --in-diff /tmp/pr-bundler.diff -j 4 --timeout 300 \
            --copy-vcs true --output mutants-bundler-out
          STATUS=$?
          set -e
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Report survivors (plugins/darkmux-bundler-rust/)
        # (#2550) `always()`, matching "Report survivors" (root) and
        # "Report survivors (runtime/)" above — see root's comment for the
        # full rationale, and note the SAME `!cancelled()` -> `always()`
        # constraint that comment names: the Mutate step above stays on
        # `!cancelled()`, only the reporting step widens.
        if: ${{ always() && steps.diff.outputs.bundler_changed_lines != '0' }}
        run: |
          python3 scripts/ci-mutants-summary.py \
            "${{ steps.mutants_bundler.outputs.exit_code }}" diff \
            "Mutation testing — this PR's changed lines (plugins/darkmux-bundler-rust/)" \
            --changed-lines "${{ steps.diff.outputs.bundler_changed_lines }}" \
            --job-status "${{ job.status }}" \
            mutants-bundler-out/mutants.out mutants-bundler.out >> "$GITHUB_STEP_SUMMARY"

      # (#2550) `always() &&` added — same reason as "Note runtime/ mutation
      # was skipped" above: this note had no status-check function at all,
      # so it silently vanished on a cancellation elsewhere in the job even
      # though this scope had nothing to do with that cancellation.
      - name: Note plugins/darkmux-bundler-rust/ mutation was skipped (nothing to mutate there)
        if: ${{ always() && steps.diff.outputs.bundler_changed_lines == '0' }}
        run: |
          {
            echo "## Mutation testing — this PR's changed lines (plugins/darkmux-bundler-rust/)"
            echo ""
            echo "Skipped — no added Rust line under \`plugins/darkmux-bundler-rust/\` could plausibly produce a mutant."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-in-diff-bundler
          path: |
            mutants-bundler-out/**
            mutants-bundler.out/**
          if-no-files-found: ignore

  coverage:
    name: coverage — which lines never execute
    runs-on: macos-latest
    permissions:
      contents: write   # pushes the badge branch (main only)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Measure
        run: |
          cargo llvm-cov --workspace --summary-only --json --output-path cov.json
          cargo llvm-cov --workspace --summary-only

      - name: Report, and name the zero-coverage regions
        if: always()
        run: python3 scripts/ci-coverage-summary.py cov.json --badge coverage-badge.json >> "$GITHUB_STEP_SUMMARY"

      # The coverage run builds with every feature, so the `ts-export` tests
      # regenerate `ui/src/types/generated/*.ts` from the Rust types. A field
      # added to an exported struct without regenerating leaves the committed
      # binding stale — and nothing caught that until the badge step below
      # tripped over the modified file on main (2026-09-05: `CrawlSummary.ts`,
      # stale since #2357, failed every main push for a day while every PR
      # run stayed green). Fail HERE, on the PR, with the remedy.
      - name: Generated TS bindings are in sync with the Rust types
        run: |
          if ! git diff --exit-code -- ui/src/types/generated; then
            echo "::error::ui/src/types/generated is stale. Run 'cargo test -p darkmux-lab --features ts-export export_bindings' (and the same for any other crate with ts(export) types) and commit the regenerated bindings."
            exit 1
          fi
          echo "generated bindings match the Rust types"

      # (#1792) Publish the badge to an orphan `badges` branch that shields.io
      # reads. Deliberately NOT a third-party service: no account, no data
      # leaving the repo, no token beyond GITHUB_TOKEN. main-only, so a PR
      # cannot move the published number.
      - name: Publish coverage badge (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -s coverage-badge.json || { echo "no badge JSON — skipping"; exit 0; }
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tmp=$(mktemp -d); cp coverage-badge.json "$tmp/coverage.json"
          # The measure step may leave tracked files modified (regenerated
          # bindings, build side effects); a dirty tree makes `git checkout`
          # refuse, and the old `|| --orphan` fallback then silently created
          # a NEW orphan branch whose push was rejected as non-fast-forward.
          # Revert the tree first, and only take the orphan path when the
          # remote branch genuinely does not exist.
          git checkout -q -- .
          if git fetch origin badges --depth=1 2>/dev/null; then
            git checkout -q badges
          else
            echo "no remote badges branch yet — creating it"
            git checkout -q --orphan badges
          fi
          git rm -rqf . 2>/dev/null || true
          cp "$tmp/coverage.json" coverage.json
          git add coverage.json
          git diff --cached --quiet && { echo "unchanged"; exit 0; }
          git commit -qm "coverage badge: $(python3 -c "import json;print(json.load(open('coverage.json'))['message'])")"
          git push -q origin badges

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-json
          path: cov.json
          if-no-files-found: ignore

  mutants-full:
    # (#2499) SHARDED nightly sweep across the whole workspace (root package +
    # every crate under `crates/`) — the job used to be root-package-only
    # despite its "full workspace" name (see the git history of this comment
    # for the full account of why an unsharded run, even `--workspace`,
    # could never finish: the only nightly that ever ran to an honest
    # conclusion under the post-#2504 exit-code-honest gate — run
    # 34224570708, root-only scope — was CANCELLED at its 350-minute budget
    # having completed only 973 of 2,136 mutants, ~21.4s/mutant on the real
    # `macos-latest` runner, projecting ~12.7h for root alone and ~76h for
    # the full workspace at that flat rate).
    #
    # SHARDING AXIS: crate first (`-p <crate>`, the natural package boundary
    # cargo-mutants already understands — matches this repo's actual
    # `crates/*` structure rather than an arbitrary mutant-index split), then
    # `--shard i/k` WITHIN a crate only when its own mutant count is large
    # enough to blow a single job's budget on its own. Fresh census,
    # 2026-09-15, `cargo mutants --workspace --list --json` (grown from
    # #2499's own 2026-09-09/10 figures as the tree grew):
    #
    #   root (src/)      2,319     darkmux-flow        1,066
    #   darkmux-crew     3,748     darkmux-doctor        695
    #   darkmux-lab      2,591     darkmux-types         692
    #   darkmux-serve    1,344     darkmux-profiles      600
    #                              darkmux-gestalt       223
    #                              darkmux-fleet         147
    #                              darkmux-heuristics     97
    #                              darkmux-hardware       88
    #                              darkmux-eureka         26
    #                                        TOTAL:  13,636
    #
    # SHARD SIZE: targeted at ~700 mutants/shard, sized against the one real
    # CI-measured rate this repo has (21.4s/mutant, cited above) — 700
    # mutants is ~250 minutes of mutate-testing, leaving headroom under this
    # job's 300-minute timeout AND the platform's own 6-hour hard per-job cap
    # (GitHub-hosted runners cannot exceed this regardless of
    # `timeout-minutes` — a known platform constraint, not independently
    # re-verified against this account). Two fresh local samples this
    # session corroborate the 21.4s/mutant anchor rather than replace it —
    # both on FASTER local hardware than `macos-latest`, so it stays the
    # conservative choice for sizing CI shards: darkmux-eureka's full
    # 26-mutant sweep (leaf crate, trivial rebuild) ran in 38s (~1.5s/mutant,
    # and found 18 of 26 SURVIVING — see the GATE note below); a 38-mutant
    # `--shard 0/100` sample of darkmux-crew (the largest, most
    # representative crate) settled at ~20-27s/mutant once `-j 4` warmed up.
    #
    #   root      2,319 / 700 -> 4 shards     flow        1,066 / 700 -> 2 shards
    #   crew      3,748 / 700 -> 6 shards     doctor        695        -> 1 shard
    #   lab       2,591 / 700 -> 4 shards     types         692        -> 1 shard
    #   serve     1,344 / 700 -> 2 shards     profiles      600        -> 1 shard
    #
    # 21 shard-jobs total, hand-enumerated in the matrix below rather than
    # computed by a separate dynamic-matrix-generation job — same posture as
    # every other hardcoded, dated, re-measurable number already in this
    # file. Will need recalibrating as the tree grows; that is a comment
    # update, not a redesign. The five smallest crates (gestalt, fleet,
    # heuristics, hardware, eureka — 581 mutants combined, each individually
    # too small to justify its own job's fixed toolchain-install +
    # rust-cache overhead) are swept in ONE separate job below,
    # `mutants-full-small`, as sequential un-sharded invocations — the same
    # shape `mutants-in-diff` already uses for its `runtime/` and
    # `plugins/darkmux-bundler-rust/` invocations.
    #
    # GATE: stays ADVISORY on survivor count, same reasoning as every other
    # mutation job in this file (a hard gate would fail every honest PR
    # against pre-existing debt) — and that is not a hypothetical here: a
    # full sweep of darkmux-eureka THIS SESSION (26 mutants, a small,
    # unassuming leaf crate) found 18 SURVIVORS (69%), almost entirely
    # `eval_memory_headroom`'s arithmetic (`crates/darkmux-eureka/src/lib.rs`
    # around line 259-278) — every `*`/`/`/`+`/`-`/`>` in that function can be
    # swapped and the test suite notices nothing. Gating on that number today
    # would fail every build; it is exactly the backlog this job exists to
    # surface, not enforce. What still GATES, unchanged from before this fix:
    # tool integrity — did the tool actually run, did it contradict its own
    # exit code, was it cancelled — see `scripts/ci-mutants-summary.py`'s own
    # module comment. Each shard's own "Summarize" step below still fails
    # ITS job on that basis; `fail-fast: false` means one shard's tool-
    # integrity failure never cancels its siblings.
    #
    # COST: total mutate-testing compute is the SAME regardless of sharding
    # (sharding parallelizes wall-clock, it does not reduce total work) — SO
    # roughly 13,636 mutants x 21.4s =~ 81 macOS-hours of mutate-testing per
    # night, spread across these 21 shard-jobs plus `mutants-full-small`
    # (22 jobs total).
    # This repo is PUBLIC (verified via `gh repo view --json
    # isPrivate,visibility` before writing this, not assumed — GitHub does
    # not meter Actions minutes for GitHub-hosted runners on public repos,
    # unlike the private-repo "metered minutes" framing this fix was
    # originally briefed under), so this costs $0 in billed minutes. Real
    # costs that remain: each shard's own wall-clock against the 6-hour
    # platform cap (the shard sizing above addresses this), and how many of
    # these 22 jobs the account's macOS-runner concurrency limit lets
    # run AT ONCE — NOT verified against this account. If that limit is the
    # commonly-cited default of 5 concurrent macOS jobs for Free/Pro
    # accounts, 22 jobs / 5-at-a-time =~ 5 waves x ~4h =~ 20h wall-clock to
    # fully complete every night, leaving buffer before the next 07:23 UTC
    # cron fires. The per-shard `concurrency` group below queues a slow
    # night's overrun instead of letting two sweeps of the SAME shard
    # collide; it does not serialize DIFFERENT shards against each other.
    #
    # CADENCE: unchanged — nightly (`schedule:` at the top of this file) plus
    # `workflow_dispatch` for on-demand validation, same triggers as before
    # sharding. A full sweep every night, not a rotation across nights,
    # because the real constraint here is wall-clock/job-count, not billed
    # minutes (see COST above) — revisit toward a rotation if the real
    # nightly runs this enables show the concurrency limit makes the ~20h
    # projection above a recurring problem rather than a worst case.
    #
    # SCOPE: `runtime/` and `plugins/darkmux-bundler-rust/` are NOT part of
    # this matrix, same exclusion the root `Cargo.toml`'s `[workspace]
    # exclude` already documents — `cargo mutants --workspace` structurally
    # cannot reach either (confirmed on #2599; that is why `mutants-in-diff`
    # runs them as separate `--manifest-path` invocations). A nightly sweep
    # of `runtime/` (1,529 mutants, `cargo mutants --manifest-path
    # runtime/Cargo.toml --list`) is real, deferred follow-up work, not done
    # here — #2499's own comment already projected it at ~9.1h unsharded on
    # `macos-latest`, which is the SAME disease this fix closes for
    # `crates/*` and would need the same shard treatment, not a flag.
    # `plugins/darkmux-bundler-rust/` (224 mutants, ~4min unsharded) stays
    # covered only by the PR-diff job, per the judgment call already
    # recorded at its own former call site in this job's history — cheap
    # enough that adding a nightly job for it later needs no re-measurement,
    # just the job. `tools/darkmux-mock-model` stays uncovered everywhere,
    # unchanged (dev/test infrastructure, not production code).
    name: mutation — full workspace sweep (nightly, sharded)
    runs-on: macos-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 300
    concurrency:
      # Scoped to scope+shard, not the whole job: a re-run of the SAME shard
      # (e.g. a `workflow_dispatch` fired to validate this fix while last
      # night's cron run for that identical shard is still in flight) queues
      # rather than doubling up. Different shards are NOT in each other's
      # group, so they still run in parallel — this must never serialize the
      # matrix, only protect a given shard against itself.
      group: mutants-full-${{ matrix.scope }}-${{ matrix.shard_label }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - { scope: root, package: "", shard: "0/4", shard_label: "0-4" }
          - { scope: root, package: "", shard: "1/4", shard_label: "1-4" }
          - { scope: root, package: "", shard: "2/4", shard_label: "2-4" }
          - { scope: root, package: "", shard: "3/4", shard_label: "3-4" }
          - { scope: crew, package: "darkmux-crew", shard: "0/6", shard_label: "0-6" }
          - { scope: crew, package: "darkmux-crew", shard: "1/6", shard_label: "1-6" }
          - { scope: crew, package: "darkmux-crew", shard: "2/6", shard_label: "2-6" }
          - { scope: crew, package: "darkmux-crew", shard: "3/6", shard_label: "3-6" }
          - { scope: crew, package: "darkmux-crew", shard: "4/6", shard_label: "4-6" }
          - { scope: crew, package: "darkmux-crew", shard: "5/6", shard_label: "5-6" }
          - { scope: lab, package: "darkmux-lab", shard: "0/4", shard_label: "0-4" }
          - { scope: lab, package: "darkmux-lab", shard: "1/4", shard_label: "1-4" }
          - { scope: lab, package: "darkmux-lab", shard: "2/4", shard_label: "2-4" }
          - { scope: lab, package: "darkmux-lab", shard: "3/4", shard_label: "3-4" }
          - { scope: serve, package: "darkmux-serve", shard: "0/2", shard_label: "0-2" }
          - { scope: serve, package: "darkmux-serve", shard: "1/2", shard_label: "1-2" }
          - { scope: flow, package: "darkmux-flow", shard: "0/2", shard_label: "0-2" }
          - { scope: flow, package: "darkmux-flow", shard: "1/2", shard_label: "1-2" }
          - { scope: doctor, package: "darkmux-doctor", shard: "", shard_label: "solo" }
          - { scope: types, package: "darkmux-types", shard: "", shard_label: "solo" }
          - { scope: profiles, package: "darkmux-profiles", shard: "", shard_label: "solo" }
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          key: mutants-full-${{ matrix.scope }}

      - name: Install cargo-mutants
        # Pinned for the reason spelled out in mutants-in-diff's install step:
        # this job's pass/fail is read out of cargo-mutants' exit codes and
        # `outcomes.json` field names. Bump both sites together.
        run: cargo install cargo-mutants --locked --version 27.1.0

      - name: Summary script self-test
        run: python3 scripts/ci-mutants-summary.py --self-test

      - name: Sweep this shard
        id: mutants
        run: |
          # Same fix as `mutants-in-diff`: no `|| true` swallowing the exit
          # code, and `--copy-vcs true` so the copied build tree is a real
          # git repo (this repo has tests that shell out to git and panic
          # without one). `-p`/`--shard` are built from the matrix entry —
          # root's four shards omit `-p` (cargo-mutants auto-scopes to the
          # root `darkmux` package when the workspace root also carries a
          # `[package]` table, the same behavior this job always had before
          # #2499 widened it), everything else names its crate; the three
          # single-shard scopes (doctor/types/profiles) omit `--shard`
          # entirely rather than passing a meaningless `0/1`.
          set +e
          ARGS=(-j 4 --timeout 120 --copy-vcs true --output mutants-out)
          if [ -n "${{ matrix.package }}" ]; then
            ARGS+=(-p "${{ matrix.package }}")
          fi
          if [ -n "${{ matrix.shard }}" ]; then
            ARGS+=(--shard "${{ matrix.shard }}")
          fi
          cargo mutants "${ARGS[@]}"
          STATUS=$?
          set -e
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Summarize
        # `always()`, same reasoning as the pre-existing "Summarize" step this
        # replaces: a shard cut off by ITS OWN `timeout-minutes` must still
        # report partial progress rather than leaving its section of the run
        # summary silently absent — see ci-mutants-summary.py's own
        # `CANCELLED_SENTINEL` and #2550's rationale, unchanged by sharding.
        if: always()
        run: |
          python3 scripts/ci-mutants-summary.py \
            "${{ steps.mutants.outputs.exit_code }}" full \
            "Nightly mutation sweep — ${{ matrix.scope }} shard ${{ matrix.shard_label }} (see #2499)" \
            --job-status "${{ job.status }}" \
            mutants-out/mutants.out mutants.out >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          # (v4 requires run-unique artifact names, unlike v3 — scope+shard
          # makes every one of the 21 matrix jobs distinct.)
          name: mutants-full-${{ matrix.scope }}-${{ matrix.shard_label }}
          path: |
            mutants-out/**
            mutants.out/**
          if-no-files-found: ignore

  mutants-full-small:
    # (#2499) The five crates too small to be worth their own matrix entry
    # above (223+147+97+88+26 = 581 mutants combined) — one job, five
    # sequential un-sharded invocations, the same shape `mutants-in-diff`
    # already uses for its `runtime/` + `plugins/darkmux-bundler-rust/` pair.
    # At the 21.4s/mutant anchor the matrix job's own comment cites, 581
    # mutants is ~3.5h of mutate-testing before the five baselines are even
    # counted; 270 minutes (4.5h) below gives real margin under that and the
    # platform's 6-hour hard cap.
    name: mutation — full workspace sweep (nightly, small crates)
    runs-on: macos-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 270
    concurrency:
      group: mutants-full-small
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          key: mutants-full-small

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked --version 27.1.0

      - name: Summary script self-test
        run: python3 scripts/ci-mutants-summary.py --self-test

      - name: Sweep darkmux-gestalt
        id: gestalt
        if: ${{ !cancelled() }}
        run: |
          set +e
          cargo mutants -j 4 --timeout 120 --copy-vcs true -p darkmux-gestalt --output mutants-out-gestalt
          STATUS=$?
          set -e
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Summarize darkmux-gestalt
        if: always()
        run: |
          python3 scripts/ci-mutants-summary.py \
            "${{ steps.gestalt.outputs.exit_code }}" full \
            "Nightly mutation sweep — darkmux-gestalt (see #2499)" \
            --job-status "${{ job.status }}" \
            mutants-out-gestalt/mutants.out mutants.out-gestalt >> "$GITHUB_STEP_SUMMARY"

      - name: Sweep darkmux-fleet
        id: fleet
        if: ${{ !cancelled() }}
        run: |
          set +e
          cargo mutants -j 4 --timeout 120 --copy-vcs true -p darkmux-fleet --output mutants-out-fleet
          STATUS=$?
          set -e
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Summarize darkmux-fleet
        if: always()
        run: |
          python3 scripts/ci-mutants-summary.py \
            "${{ steps.fleet.outputs.exit_code }}" full \
            "Nightly mutation sweep — darkmux-fleet (see #2499)" \
            --job-status "${{ job.status }}" \
            mutants-out-fleet/mutants.out mutants.out-fleet >> "$GITHUB_STEP_SUMMARY"

      - name: Sweep darkmux-heuristics
        id: heuristics
        if: ${{ !cancelled() }}
        run: |
          set +e
          cargo mutants -j 4 --timeout 120 --copy-vcs true -p darkmux-heuristics --output mutants-out-heuristics
          STATUS=$?
          set -e
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Summarize darkmux-heuristics
        if: always()
        run: |
          python3 scripts/ci-mutants-summary.py \
            "${{ steps.heuristics.outputs.exit_code }}" full \
            "Nightly mutation sweep — darkmux-heuristics (see #2499)" \
            --job-status "${{ job.status }}" \
            mutants-out-heuristics/mutants.out mutants.out-heuristics >> "$GITHUB_STEP_SUMMARY"

      - name: Sweep darkmux-hardware
        id: hardware
        if: ${{ !cancelled() }}
        run: |
          set +e
          cargo mutants -j 4 --timeout 120 --copy-vcs true -p darkmux-hardware --output mutants-out-hardware
          STATUS=$?
          set -e
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Summarize darkmux-hardware
        if: always()
        run: |
          python3 scripts/ci-mutants-summary.py \
            "${{ steps.hardware.outputs.exit_code }}" full \
            "Nightly mutation sweep — darkmux-hardware (see #2499)" \
            --job-status "${{ job.status }}" \
            mutants-out-hardware/mutants.out mutants.out-hardware >> "$GITHUB_STEP_SUMMARY"

      - name: Sweep darkmux-eureka
        id: eureka
        if: ${{ !cancelled() }}
        run: |
          set +e
          cargo mutants -j 4 --timeout 120 --copy-vcs true -p darkmux-eureka --output mutants-out-eureka
          STATUS=$?
          set -e
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Summarize darkmux-eureka
        # (#2499) Real numbers from this session, not a placeholder: this
        # crate's full 26-mutant sweep found 18 survivors (69%) — see the
        # matrix job's GATE comment above. Expect this section of the nightly
        # summary to report that until someone works the backlog down; it is
        # advisory, not a broken check.
        if: always()
        run: |
          python3 scripts/ci-mutants-summary.py \
            "${{ steps.eureka.outputs.exit_code }}" full \
            "Nightly mutation sweep — darkmux-eureka (see #2499)" \
            --job-status "${{ job.status }}" \
            mutants-out-eureka/mutants.out mutants.out-eureka >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-full-small
          path: |
            mutants-out-*/**
            mutants.out-*/**
          if-no-files-found: ignore
