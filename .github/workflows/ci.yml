name: CI

# Runs on every pull request and on pushes to main. Fails the workflow
# on ANY warning — see `RUSTFLAGS: "-D warnings"` and `cargo clippy -D warnings`
# below. Tested locally via the same commands.
#
# Performance notes (#523, revised — CI timeout flake, 2026-07-13):
#   * Caching is via Swatinem/rust-cache — it keys on the lockfile + rustc
#     version, scopes per-job, and prunes the stale `target/` artifacts that
#     made the old hand-rolled actions/cache grow slower over time.
#   * The heavy build/test/lint steps are gated behind a paths-filter so a
#     docs-only / viewer-only PR reports green in seconds instead of paying
#     the full Rust pipeline. We deliberately do NOT split by CRATE: a change
#     to a foundational crate (e.g. darkmux-flow) must still exercise its
#     reverse-dependents, so any Rust change runs the full workspace
#     test+clippy. The filter only distinguishes "Rust-relevant changed" from
#     "nothing Rust-relevant changed".
#   * DEV profile, not release: PR-gating CI dropped `--release` from both
#     `cargo test` and `cargo clippy` (and dropped the separate `cargo build
#     --release` step entirely — `cargo clippy --all-targets` already compiles
#     every target, catching build breaks as a side effect). Release-mode
#     optimization doesn't change test/lint CORRECTNESS, only compile time —
#     and it was the single biggest cost driver, routinely pushing this job
#     past its 15-minute cap even on a successful run (13m26s measured on a
#     clean pass, no margin left). A genuinely release-mode-only issue (an
#     LTO/codegen-unit interaction, a `#[cfg(not(debug_assertions))]` path)
#     is a real but rare gap this trades away — covered instead by
#     `release-verify.yml` (workflow_dispatch-only, full `--release` gate),
#     run by hand on the last PR before cutting a release; see that
#     workflow's own header and the `darkmux-point-release` skill.
#   * The runtime/ crate (excluded from the parent workspace, own Cargo.lock —
#     #463) now runs as its OWN parallel job instead of appending to this
#     one's sequential steps, with its OWN paths-filter scoped to `runtime/**`
#     — it has zero dependency on the parent workspace's sources (confirmed:
#     its `include_str!`s only ever resolve within `runtime/`), so a
#     workspace-only PR skips it entirely and a runtime-only PR skips the
#     (much heavier) workspace job.

on:
  pull_request:
    # `ui/port` is here deliberately. It is a long-lived INTEGRATION branch
    # that accumulated eight packets' worth of PRs, and because this filter
    # named only `main`, every one of those merged with ZERO CI — the whole
    # port was reviewed by hand and by local runs alone, and a stale
    # committed bundle or a cross-packet type collision would have been
    # caught only at the eventual `ui/port` → main PR, if at all. The
    # paths-filters below mean a UI-only PR into `ui/port` still skips the
    # heavy Rust jobs, so this costs little and closes a real hole.
    branches: [main, ui/port]
  push:
    branches: [main]
  # Daily advisory sweep: catches a newly-disclosed RUSTSEC advisory against an
  # unchanged dependency without waiting for the next dep-touching PR.
  schedule:
    - cron: "17 6 * * *"

env:
  CARGO_TERM_COLOR: always
  # Treat all warnings (build + clippy + rustdoc) as errors. Any new dead-code
  # or lint regression fails CI rather than accumulating silently.
  RUSTFLAGS: "-D warnings"

jobs:
  build-test-lint:
    name: build + test + lint (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Decide whether this change touches anything that can affect the
      # PARENT WORKSPACE's build, tests, or lints. `templates/**` is included
      # because workload/role/skill assets are `include_str!`'d into the
      # binary, so editing them changes compiled output and the tests that
      # assert on it. The workflow file itself is included so CI changes
      # always self-test. `runtime/**` is EXCLUDED — that crate is its own
      # workspace root (#463) with zero dependency on these sources, and now
      # runs as its own parallel job below with its own scoped filter, so a
      # runtime-only PR doesn't also pay for this (heavier) job.
      - name: Detect Rust-relevant changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - 'templates/**'
              - '.github/workflows/ci.yml'
              - '!runtime/**'

      - name: Install Rust stable toolchain
        if: steps.filter.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry + build artifacts
        if: steps.filter.outputs.rust == 'true'
        uses: Swatinem/rust-cache@v2

      # Format check intentionally NOT enforced yet — the codebase has
      # accumulated style drift that would mask the more important
      # lints. Tracked as a follow-up (`cargo fmt --all` once, then
      # re-enable here).

      # DEV profile (see this file's header) — no separate `cargo build`
      # step: `cargo clippy --all-targets` below already compiles every
      # target (bins/examples/tests), so a plain build-only check would be
      # redundant work, not extra coverage.
      - name: Test (whole workspace)
        if: steps.filter.outputs.rust == 'true'
        run: cargo test --workspace

      - name: Clippy (whole workspace, all targets, no warnings allowed)
        if: steps.filter.outputs.rust == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: No Rust-relevant changes — pipeline skipped
        if: steps.filter.outputs.rust != 'true'
        run: echo "No Rust / Cargo / template / workflow changes detected; test+lint skipped (reports green)."

  fleet-e2e:
    name: fleet e2e (ubuntu-latest, real redis)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # (#1662) These tests existed and had NEVER RUN AT A GATE.
    #
    # All seven `tests/e2e_*.rs` binaries open with a `redis_available()`
    # guard whose false arm `eprintln!`s and `return`s — a SILENT PASS. No
    # workflow installed redis-server, so every e2e test on every CI run
    # since the harness landed reported `ok` without executing: a real boot
    # pays a release build plus two daemon spawns, and `dual_node_harness_
    # boots_cleanly` was completing in 8 MILLISECONDS.
    #
    # Since CI is the merge gate here (local runs are targeted-module by
    # doctrine), the entire fleet layer — daemon boot, RedisSink XADD,
    # dispatch fan-out + re-dispatch gating, partial-publish atomicity,
    # `machine list --deep` token forwarding — was guarded by nothing. That
    # is #975's shape (a broken dispatch path riding four releases of green
    # CI) with a wider surface.
    #
    # UBUNTU, not the macos job that runs the rest of the workspace. Three
    # reasons: apt installs redis in seconds where brew takes tens of them;
    # the harness has no macOS dependency (no Keychain, no `lms`, no
    # `target_os` gate); and isolating the release build keeps it off the
    # 15-minute cap of the main job.
    #
    # A SERVICE CONTAINER WOULD NOT WORK HERE, which is worth recording so
    # nobody "simplifies" it into one: the harness spawns its OWN
    # `redis-server` on a random free port PER TEST (see harness.rs's
    # `spawn_redis`) for isolation. It needs the BINARY on PATH, not a
    # server on 6379.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Rust-relevant changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'src/**'
              - 'crates/**'
              - 'tests/**'
              - 'templates/**'
              - '.github/workflows/ci.yml'

      - name: Install Rust stable toolchain
        if: steps.filter.outputs.rust == 'true'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        if: steps.filter.outputs.rust == 'true'
        with:
          key: fleet-e2e

      - name: Install redis-server
        if: steps.filter.outputs.rust == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq redis-server
          redis-server --version

      # The harness builds the release binary INSIDE `cargo test` unless
      # told otherwise, which would serialize a full release build behind
      # the test timer. `DARKMUX_E2E_BIN` (harness.rs) exists for exactly
      # this: build once here, point the harness at the artifact.
      - name: Build the release binary the harness will drive
        if: steps.filter.outputs.rust == 'true'
        run: cargo build --release --bin darkmux

      - name: Fleet e2e (real daemons, real redis)
        if: steps.filter.outputs.rust == 'true'
        env:
          DARKMUX_E2E_BIN: ${{ github.workspace }}/target/release/darkmux
          # (#1662) Turns the silent skip into a hard failure — but ONLY
          # here. Keyed on this var rather than `CI` because GitHub sets
          # `CI` on every runner, and the macOS workspace job runs these
          # same binaries without redis; gating on `CI` would have failed
          # the job that correctly is not responsible for this suite.
          DARKMUX_E2E_REQUIRED: "1"
        # `cargo test --test 'e2e_*'` DOES glob (verified: resolves 6) and
        # exits 101 when a pattern matches nothing (verified) — so a rename
        # cannot silently empty this job. An earlier revision added a
        # count-asserting preamble on top of that; it was redundant with
        # cargo's own behavior and became its own failure mode, which is the
        # sort of guard that costs more than it protects. Removed.
        run: |
          cargo test --workspace --test 'e2e_*'

      - name: No Rust-relevant changes — fleet e2e skipped
        if: steps.filter.outputs.rust != 'true'
        run: echo "No Rust-relevant changes; fleet e2e skipped (reports green)."

  runtime-test-lint:
    name: runtime crate — test + lint (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The runtime crate is EXCLUDED from the parent cargo workspace (#463 —
      # it builds against musl in the darkmux-runtime Docker image) and is its
      # own workspace root with its own Cargo.lock. Its `include_str!`s only
      # ever resolve within `runtime/` (confirmed 2026-07-13) — zero
      # dependency on the parent workspace's sources — so this job's filter
      # is scoped to `runtime/**` alone, letting it run IN PARALLEL with
      # `build-test-lint` above instead of appending to that job's sequential
      # steps (the change that fixed this job's chronic near-timeout).
      - name: Detect runtime-relevant changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            runtime:
              - 'runtime/**'
              - '.github/workflows/ci.yml'

      - name: Install Rust stable toolchain
        if: steps.filter.outputs.runtime == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry + build artifacts
        if: steps.filter.outputs.runtime == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime

      # DEV profile — see ci.yml's header for the reasoning (shared with the
      # parent-workspace job above). Image build itself needs a Docker
      # daemon — deferred to a follow-up Linux job; macOS runners don't ship
      # a working Docker.
      - name: Test (runtime crate)
        if: steps.filter.outputs.runtime == 'true'
        run: cargo test --manifest-path runtime/Cargo.toml

      - name: Clippy (runtime crate, all targets, no warnings allowed)
        if: steps.filter.outputs.runtime == 'true'
        run: cargo clippy --manifest-path runtime/Cargo.toml --all-targets -- -D warnings

      - name: No runtime-relevant changes — pipeline skipped
        if: steps.filter.outputs.runtime != 'true'
        run: echo "No runtime/ changes detected; test+lint skipped (reports green)."

  cargo-audit:
    name: cargo audit (RUSTSEC advisories)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # On a PR, only do real work when the dependency set actually changes —
      # an advisory regression can't ride in on a docs/viewer-only PR, and those
      # PRs aren't blocked by this job. The daily `schedule` run and pushes to
      # main always audit (they have no `before` filter / aren't gated here), so
      # a freshly-disclosed advisory against an unchanged dep still surfaces.
      - name: Detect dependency changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        id: deps
        with:
          filters: |
            deps:
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - '.github/workflows/ci.yml'

      - name: Should this run audit?
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] || [ "${{ steps.deps.outputs.deps }}" == "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No dependency changes on this PR; cargo audit skipped (reports green)."
          fi

      - name: Install cargo-audit
        if: steps.gate.outputs.run == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # The workspace excludes the runtime crate (#463), so audit both lockfiles.
      - name: Audit workspace + runtime lockfiles
        if: steps.gate.outputs.run == 'true'
        run: |
          cargo audit
          cargo audit --file runtime/Cargo.lock

  viewer-e2e:
    name: viewer e2e (headless XSS gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Only run when the viewer, its generated demo, the XSS fixture, or the e2e
      # harness itself changes — a Rust-only or docs-only PR doesn't pay the
      # browser-download cost.
      - name: Detect viewer-relevant changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            viewer:
              - 'crates/darkmux-serve/assets/viewer.html'
              - 'docs/demo/**'
              - 'tests/fixtures/xss-flow.jsonl'
              - 'tests/fixtures/lifecycle-flow.jsonl'
              - 'tests/e2e/**'
              - '.github/workflows/ci.yml'

      - name: Setup Node
        if: steps.filter.outputs.viewer == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install e2e deps
        if: steps.filter.outputs.viewer == 'true'
        working-directory: tests/e2e
        run: npm ci

      - name: Install Chromium for Playwright
        if: steps.filter.outputs.viewer == 'true'
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium

      - name: Run viewer e2e (drives the real viewer over attacker-controlled records)
        if: steps.filter.outputs.viewer == 'true'
        working-directory: tests/e2e
        run: npx playwright test

      - name: No viewer-relevant changes — e2e skipped
        if: steps.filter.outputs.viewer != 'true'
        run: echo "No viewer / demo / fixture / e2e changes detected; viewer e2e skipped (reports green)."

  docs-drift:
    name: docs drift guard (retired terms)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Turns "the docs silently drifted" into a blocked PR — CLAUDE.md's principle
      # that "doc drift is a bug, not a footnote." Grow this guard as the
      # observability-unification guide rewrites land (#556): add 'instruments.jsonl'
      # / '--instrument' once #557 ships, and 'click Connect' / live
      # darkmux.com/{flow,topology,lab} once the daemon-hosted viewer (#554/#558) ships.
      - name: No retired terms in user-facing docs
        run: |
          # 'admin' role family was renamed to 'utility' with NO compat alias —
          # crates/darkmux-crew validate_role_family REJECTS 'admin' at load time.
          # Scanned set: the user-facing doc surfaces PLUS packaging/ — the
          # brew formula's caveats are printed to every installing user, and a
          # retired-verb spelling slipped through there once precisely because
          # packaging/ was outside this set (#1426 phase-2 gate finding).
          # AGENTS.md and skills/ added for the same reason (#1449 gate
          # finding, extending the ship-6 #1426 finding that put AGENTS.md
          # here): skills/ ships into users' ~/.claude/skills/ via
          # `darkmux init` (include_str!-embedded), and AGENTS.md is the
          # agent-facing repo doc — both carried retired identity text that
          # the doc-only set missed.
          # (#1449) The scanned file set + the ONE corpus exclusion, shared by
          # all three scans below so they can never drift apart. templates/ was
          # added because it ships into the binary via include_str! (the SAME
          # rationale that put skills/ in-set — a retired verb baked into a
          # mission-config description reaches every user), and
          # CLAUDE.md/ROADMAP.md/DISCLAIMER.md are agent/user-facing surfaces
          # that each carried 2.0 identity drift a doc-only set missed.
          # EXCLUSION: templates/builtin/lab-fixtures/pr-review-bench/ is LABELED
          # benchmark corpus — adversarial PR diffs that intentionally quote
          # retired verbs (e.g. `darkmux mission run` in a test case). Corpus is
          # never reworded; its dir is excluded from every scan.
          SCAN="README.md CONTRIBUTING.md DESIGN.md AGENTS.md CLAUDE.md ROADMAP.md DISCLAIMER.md docs/index.html docs/guide/ docs/architecture/ packaging/ skills/ templates/"
          EXCL="--exclude-dir=pr-review-bench"
          PAT='admin[- ]agent|admin</code>'
          if bad=$(grep -rniE $EXCL "$PAT" $SCAN 2>/dev/null); then
            echo "::error::Retired term in user-facing docs — use 'utility', not 'admin' (the role_family loader rejects 'admin'):"
            echo "$bad"
            exit 1
          fi
          # (#1426) Verb spellings retired with NO compat alias.
          # Phase 1: `darkmux profiles` -> `darkmux profile list`, `darkmux
          # scan` -> `darkmux profile scan`, `darkmux notebook ...` -> `darkmux
          # lab notebook ...`, `darkmux pr-review ...` -> `darkmux mission
          # launch review`, `darkmux external ...` -> pipe into `mission
          # propose`.
          # Phase 2: `darkmux crew dispatch <role>` -> `darkmux dispatch
          # <role>` (dispatch promoted to a top-level verb), and `darkmux
          # skills ...` -> `darkmux init` (init is the one setup/refresh verb;
          # doctor flags stale darkmux-* skills).
          # Phase 3: `darkmux status` -> `darkmux machine status`, `darkmux
          # swap ...` -> retired (gestalt loads residents at dispatch),
          # `darkmux model ...` -> `darkmux machine {status,resources,eject}`,
          # `darkmux fleet ...` -> `darkmux machine {list,add,remove}`,
          # `darkmux recommendations ...` -> retired.
          # ship-2: the `crew` family retired ENTIRELY (#1426 round 4 — the
          # crew registry dissolved; the registry-read verbs list/show/index
          # went with the crews map), so the bare `crew` alternative catches
          # every crew spelling. Ship-4: `darkmux mission run ...` ->
          # `darkmux mission launch coder-phase`.
          # Round 10 (#1463): the `phase` family retired ENTIRELY (estimate +
          # review + start/complete/abandon), so the bare `phase` alternative
          # catches every phase spelling; `darkmux mission ship ...` retired
          # (the frontier does git/gh by hand, then `mission finalize`); and
          # `darkmux mission close ...` renamed to `darkmux mission finalize`.
          # The word boundary + the literal `darkmux ` anchor keep the NEW
          # spellings clean: `darkmux machine status` does not contain the
          # two-word `darkmux status`, and `darkmux profile scan` does not
          # contain `darkmux scan`. `model`/`status`/`fleet` are common words,
          # so the anchor matches ONLY the `darkmux <verb>` invocation form,
          # and the two-word alternatives (`mission run`/`ship`/`close`) anchor
          # on the full spelling so the surviving `mission launch`/`finalize`/
          # `abort`/`add-phase` family does NOT trip (`add-phase` is `darkmux
          # mission`, never `darkmux phase`).
          # Decision 17: `darkmux lessons ...` -> `darkmux memory lesson ...`
          # (the family retired into `memory`, whose second kind is
          # `memory correction`). `lessons` is plural + darkmux-specific, so the
          # `darkmux ` anchor + word boundary can't false-match the singular
          # `memory lesson` spelling or the word "lessons" in prose.
          # Round 11 (#1465): the `lab` SECOND-LEVEL surface regrouped. The flat
          # plural-noun-as-verb leaves + flat run/fixture leaves + the
          # role-scoped snowflake all retired into kind-families: `lab runs` ->
          # `lab run list`, `lab workloads` -> `lab workload list`, `lab
          # fixtures` -> `lab fixture list`, `lab inspect` -> `lab run inspect`,
          # `lab compare` -> `lab run compare`, `lab register`/`lab unregister`
          # -> `lab fixture register`/`unregister`, `lab review-bench` -> `lab
          # eval <role>`. Each retired spelling is anchored ADJACENT-two-word,
          # so the surviving forms don't trip: `lab run compare` does not
          # contain the adjacent `lab compare`, `lab fixture register` does not
          # contain `lab register`, `lab run list` does not contain `lab runs`,
          # and the valid `lab run` dispatch verb is not `lab runs` (needs the
          # trailing `s`). The `--crew` -> `--roster-profile` flag rename is NOT
          # verb-guardable here (VERBPAT anchors on `darkmux <verb>`, and
          # `--crew` is a flag) — tests/cli.rs guards it instead.
          # Historical release-notes lines (README's status block, one line
          # per release naming its `**vX.Y.Z**`) legitimately quote old verbs
          # — excluded by the -v filter; live prose never carries that
          # bold-version marker.
          VERBPAT='darkmux (profiles|scan|notebook|pr-review|external|skills|crew|status|swap|model|fleet|recommendations|lessons|phase|mission run|mission ship|mission close|lab runs|lab workloads|lab fixtures|lab inspect|lab compare|lab register|lab unregister|lab review-bench)\b'
          if bad=$(grep -rniE $EXCL "$VERBPAT" $SCAN 2>/dev/null | grep -v '\*\*v[0-9]*\.'); then
            echo "::error::Retired verb spelling in user-facing docs (#1426/#1463/#1465) — use machine status / machine resources / machine list / machine add / profile list / profile scan / lab notebook / mission launch review / dispatch (not crew dispatch; the crew family retired entirely) / init (not skills) / mission launch coder-phase (not mission run) / memory lesson (not lessons) / mission finalize (not mission close/ship — the frontier does git/gh by hand) / mission abort or mission finalize (not the retired phase family) / lab run list|inspect|compare (not lab runs/inspect/compare) / lab workload list (not lab workloads) / lab fixture list|register|unregister (not lab fixtures/register/unregister) / lab eval (not lab review-bench); swap + recommendations retired:"
            echo "$bad"
            exit 1
          fi
          # (#1449) IDENTITY drift — the retired "profile multiplexer" self-image.
          # VERBPAT anchors on `darkmux <verb>` and so guards ZERO identity
          # language: the stale AGENTS.md block ("to multiplex local LLM stacks",
          # "## When to swap stacks", "/darkmux-swap-stack") passed it clean.
          # The 2.0 identity is "mission orchestrator and a lab". NOTE the pattern
          # is deliberately NARROW: the 2.0 docs legitimately narrate the
          # multiplexer HERITAGE ("the founding profile multiplexer, now
          # internal"; "the name comes from the multiplexer core"), so a bare
          # `multiplex` alternative would false-positive on honest history. It
          # matches only the ACTIVE-PURPOSE drift forms that are never legitimate
          # in 2.0 prose: `/darkmux-swap-stack` (a retired skill), `swap stack(s)`
          # (the retired action phrase), and `to multiplex` (present-purpose
          # framing — legit prose uses "profile multiplexer" as a noun with a
          # founding/now-internal qualifier, never "to multiplex").
          IDENTITYPAT='/darkmux-swap-stack|swap stacks?|to multiplex'
          if bad=$(grep -rniE $EXCL "$IDENTITYPAT" $SCAN 2>/dev/null | grep -v '\*\*v[0-9]*\.'); then
            echo "::error::Retired IDENTITY language in user-facing docs (#1449) — darkmux 2.0 is a mission orchestrator and a lab, NOT a profile multiplexer. Drop the swap-stack framing (residency is internal to gestalt now); reference the multiplexer only as founding/now-internal heritage:"
            echo "$bad"
            exit 1
          fi
          echo "docs drift guard passed: no retired terms"
      - name: No retired verbs in .rs string literals
        # (#1469) The docs scan above anchors on `darkmux <verb>` in DOCS, so it
        # misses a retired verb baked into a Rust user-facing string — a help/
        # error/hint message or a `println!`/`format!` banner. That blind spot
        # recurred ~5 times on the 2.0 arc (#1468 shipped a stale `mission ship
        # --merge` banner). This sibling scan closes it. The retired-verb list +
        # the allowlist mechanism (`// drift-guard:allow <verb> — <reason>`) live
        # in scripts/rs-drift-guard.py so both halves of the guard can't drift.
        run: python3 scripts/rs-drift-guard.py
      - name: Demo page is in sync with the canonical viewer
        run: |
          # darkmux.com/demo IS crates/darkmux-serve/assets/viewer.html in
          # playback mode (generated by scripts/build-demo.sh). Regenerate +
          # diff so the demo can never silently re-fork from the viewer.
          bash scripts/build-demo.sh
          if ! git diff --exit-code -- docs/demo/index.html; then
            echo "::error::docs/demo/index.html is out of sync with the viewer. Run scripts/build-demo.sh and commit the result."
            exit 1
          fi
          echo "demo in sync with the canonical viewer"

  # ────────────────────────────────────────────────────────────────────────
  # The React viewer (`ui/`) + the parity harness that grades it.
  #
  # Added because the port had NO CI at all: `ui/` is a committed BUNDLE
  # (`crates/darkmux-serve/assets/next.html`, `include_str!`'d into the
  # binary), so a packet could commit a stale artifact — source and shipped
  # page disagreeing — and every existing job would still report green. The
  # freshness step below is the load-bearing one; it is the same
  # regenerate-and-diff shape the demo-sync guard already uses for the
  # legacy viewer, and for the same reason.
  #
  # Ubuntu, not macOS: this job is node/bun + headless chromium, none of
  # which needs Apple hardware, and the Linux runner is markedly cheaper
  # than the macOS one the Rust jobs are pinned to.
  ui:
    name: ui bundle + tests + parity
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect UI-relevant changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ui:
              - 'ui/**'
              - 'tests/parity/**'
              - 'crates/darkmux-serve/assets/**'
              - '.github/workflows/ci.yml'

      - name: Install bun
        if: steps.filter.outputs.ui == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install ui dependencies
        if: steps.filter.outputs.ui == 'true'
        working-directory: ui
        run: bun install --frozen-lockfile

      # `bun run build` runs `tsc --noEmit` first, so this covers the
      # typecheck as well as the bundle. Deliberately ONE command: a
      # separate typecheck step invites a future "done when the tests pass"
      # brief that quietly excludes it.
      - name: Build the bundle (includes tsc --noEmit)
        if: steps.filter.outputs.ui == 'true'
        working-directory: ui
        run: bun run build

      # THE point of this job. `bun run build` above rewrote the committed
      # artifact from source; if that produces a diff, the artifact in the
      # commit did not match the source it claims to be built from — the
      # shipped page and the reviewed code are different programs.
      - name: Committed bundle is in sync with ui/ source
        if: steps.filter.outputs.ui == 'true'
        run: |
          if ! git diff --exit-code -- crates/darkmux-serve/assets/next.html; then
            echo "::error::crates/darkmux-serve/assets/next.html is stale. Run 'cd ui && bun run build' and commit the regenerated bundle."
            exit 1
          fi
          echo "committed bundle matches ui/ source"

      - name: UI unit tests
        if: steps.filter.outputs.ui == 'true'
        working-directory: ui
        run: bun run test

      - name: Install parity harness dependencies
        if: steps.filter.outputs.ui == 'true'
        working-directory: tests/parity
        run: bun install --frozen-lockfile

      - name: Install chromium
        if: steps.filter.outputs.ui == 'true'
        working-directory: tests/parity
        run: bunx playwright install --with-deps chromium

      # The LEGACY goldens: verify (extraction reproduces them byte-for-
      # byte), redprove (a blank page must FAIL every golden — the guard
      # against a comparison that cannot fail), determinism (two runs
      # byte-identical), tripwire (no sanitizer sentinel ever reaches a
      # committed fixture).
      - name: Legacy parity goldens
        if: steps.filter.outputs.ui == 'true'
        working-directory: tests/parity
        run: bun run check

      # The port's own acceptance: each ported lens against those goldens.
      # Run SERIALLY and each with its own config — the suites bind fixed
      # ports and share the goldens/ directory, so running them
      # concurrently makes them flake for reasons that have nothing to do
      # with the code under test.
      - name: Next-parity suites (per lens, serial)
        if: steps.filter.outputs.ui == 'true'
        working-directory: tests/parity
        run: |
          set -e
          for suite in next-parity next-parity-chrome next-parity-runs next-parity-catalog next-parity-console; do
            echo "── $suite ──"
            bun run "$suite"
          done

      # A playwright failure on a runner we cannot reproduce locally is only
      # actionable with its trace. Uploaded on failure ONLY, so a green run
      # carries no artifact cost.
      - name: Upload playwright traces on failure
        if: failure() && steps.filter.outputs.ui == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            tests/parity/test-results/**
            tests/parity/playwright-report/**
          retention-days: 7
          if-no-files-found: ignore
