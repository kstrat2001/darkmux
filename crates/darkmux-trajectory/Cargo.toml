[package]
name = "darkmux-trajectory"
version = "4.0.0-rc.1"
edition = "2021"
description = "darkmux trajectory events: the one definition the runtime writes and the host reads, and the one fold over them"
license = "MIT"
homepage = "https://darkmux.com"
repository = "https://github.com/kstrat2001/darkmux"
authors = ["Kain Osterholt"]
rust-version = "1.86"

# A leaf crate on purpose: the runtime (its own workspace, built inside the
# darkmux-runtime image) depends on it by path, so it takes nothing from the
# parent workspace, neither members nor `workspace = true` keys. Its Docker
# build context is the repo root, restricted by runtime/Dockerfile.dockerignore.
[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Off by default, so the runtime's own build (which takes only what it needs)
# does not compile it. The host enables it: the CLI's `--json` golden derives its
# field schemas from the trajectory types a `--json` output carries.
schemars = { version = "1.2", optional = true }
# Off by default; the host's `ts-export` builds derive the TypeScript twin of
# `FailedExec`, which the `step.result` flow payload carries.
ts-rs = { version = "10", optional = true }

[features]
ts-export = ["dep:ts-rs"]
