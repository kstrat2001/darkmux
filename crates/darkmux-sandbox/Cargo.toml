[package]
name = "darkmux-sandbox"
version = "5.9.3"
edition = "2021"
description = "darkmux sandbox seam — what a sandbox may see and do, one backend trait, and Docker as its backend"
license = "MIT"
homepage = "https://darkmux.com"
repository = "https://github.com/kstrat2001/darkmux"
authors = ["Kain Osterholt"]
rust-version = "1.86"

[dependencies]
# A handle is stored in records a reaper or a resume reads back.
serde = { version = "1.0", features = ["derive"] }
# (#3112) The Landlock backend confines a process with the kernel's own
# pieces, which live with the other OS differences.
darkmux-platform = { path = "../darkmux-platform" }

[dev-dependencies]
serde_json.workspace = true
tempfile = "3.10"
