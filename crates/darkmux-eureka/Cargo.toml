[package]
name = "darkmux-eureka"
version = "5.1.0"
edition = "2021"
description = "darkmux eureka rules engine — config/resource anomaly rule defs + doctor-time evaluation"
license = "MIT"
homepage = "https://darkmux.com"
repository = "https://github.com/kstrat2001/darkmux"
authors = ["Kain Osterholt"]
rust-version = "1.86"

[dependencies]
darkmux-types = { path = "../darkmux-types" }
darkmux-hardware = { path = "../darkmux-hardware" }
darkmux-profiles = { path = "../darkmux-profiles" }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json.workspace = true
