[package]
name = "darkmux-doctor"
version = "3.7.1"
edition = "2021"
description = "darkmux doctor — environment + harness self-checks (the eureka roll-up surface)"
license = "MIT"
homepage = "https://darkmux.com"
repository = "https://github.com/kstrat2001/darkmux"
authors = ["Kain Osterholt"]
rust-version = "1.80"

[dependencies]
darkmux-types = { path = "../darkmux-types" }
darkmux-flow = { path = "../darkmux-flow" }
darkmux-profiles = { path = "../darkmux-profiles" }
darkmux-crew = { path = "../darkmux-crew" }
darkmux-eureka = { path = "../darkmux-eureka" }
darkmux-hardware = { path = "../darkmux-hardware" }
darkmux-heuristics = { path = "../darkmux-heuristics" }
anyhow = "1.0"
serde_json = "1.0"
dirs = "5.0"

[dev-dependencies]
tempfile = "3.10"
serial_test = "3.1"
# (#811) Empty the config tier by construction in this crate's TEST build so
# tests never read the operator's real ~/.darkmux/config.json (e.g. doctor's
# redis-enabled / check-updates gates). Dev-dep only; off in the release binary.
darkmux-types = { path = "../darkmux-types", features = ["test-support"] }
# (#2413) `check_host_sampler`'s tests build stale/dead-pid lock fixtures
# via `host_sampler_lock::write_lock_state_for_test`.
darkmux-crew = { path = "../darkmux-crew", features = ["test-support"] }
# (#2704 fix-pass, CONSIDER B) `profiles::load_registry`'s `audit_env_read`
# for `DARKMUX_PROFILES` sits behind `cfg(any(test, feature = "test-support"))`,
# and darkmux-profiles is a NORMAL dependency here, so `cfg(test)` is false for
# it in this crate's test build. Without this the key never reaches the audit
# log and `the_guards_variable_list_covers_every_destination_the_resolvers_read`
# cannot see DARKMUX_PROFILES at all — which is why deleting it from
# CLEARED_STATE_VARS was EXIT=0 in every suite. Same shape as the two entries
# above; dev-dep only, off in the release binary.
darkmux-profiles = { path = "../darkmux-profiles", features = ["test-support"] }
