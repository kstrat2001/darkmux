[package]
name = "darkmux-platform"
version = "5.3.0"
edition = "2021"
description = "darkmux platform strategies — how each host OS answers the questions the rest of darkmux asks"
license = "MIT"
homepage = "https://darkmux.com"
repository = "https://github.com/kstrat2001/darkmux"
authors = ["Kain Osterholt"]
rust-version = "1.86"

[dependencies]

# (#3200) `sysctl` for a process's start time on macOS (`process_start_stamp`),
# moved here from darkmux-types' residency lease. Already in the workspace.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.10"
