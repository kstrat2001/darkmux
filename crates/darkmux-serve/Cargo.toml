[package]
name = "darkmux-serve"
version = "4.0.0-rc.1"
edition = "2021"
description = "darkmux serve — the flow-observability HTTP/SSE daemon"
license = "MIT"
homepage = "https://darkmux.com"
repository = "https://github.com/kstrat2001/darkmux"
authors = ["Kain Osterholt"]
rust-version = "1.86"

[dependencies]
darkmux-types = { path = "../darkmux-types" }
darkmux-flow = { path = "../darkmux-flow" }
darkmux-profiles = { path = "../darkmux-profiles" }
darkmux-crew = { path = "../darkmux-crew" }
darkmux-fleet = { path = "../darkmux-fleet" }
# (#2814) `machine_uid()` — the stable hardware identity `/machine/specs` now
# reports, so a viewer can answer "is this card the machine serving the page?"
# without the expiring flow window. Already in this crate's dependency tree
# transitively (darkmux-flow, darkmux-crew and darkmux-lab all depend on it);
# promoted to direct because this crate now names it.
darkmux-hardware = { path = "../darkmux-hardware" }
darkmux-doctor = { path = "../darkmux-doctor" }
# (#1247 Part 3) Lab observer lens — reuses `lab::review::ReviewEnvelope` +
# `lab::scores::{ScoresDoc, read_scores}` so the daemon parses the SAME
# artifact shapes `review-bench --funnel` writes instead of re-deriving a
# parallel schema. No cycle: darkmux-lab has no dependency back on darkmux-serve.
darkmux-lab = { path = "../darkmux-lab" }
anyhow = "1.0"
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "fs", "io-util", "process", "time", "sync"] }
tokio-stream = "0.1"
futures = "0.3"
# (#2916 stage 2) A fingerprint of the fleet token a queued job was
# admitted with (never the token itself). Already in the tree via
# darkmux-flow's audit sink.
blake3 = "1.5"
tower-http = { version = "0.5", features = ["cors", "timeout"] }
serde = { version = "1.0", features = ["derive"] }
serde_json.workspace = true
redis = { version = "0.27", default-features = false, features = ["streams"] }
# (#1914) Promoted from dev-only: the fleet-snapshot handoff file a spawned
# `run-list` panel child reads (`write_fleet_snapshot_file` in lib.rs,
# `needs_fleet_snapshot` in panel.rs) is production code, not test fixture
# plumbing.
tempfile = "3.10"
# (#1466) `peer_graph`'s best-effort peer-mission-graph fetch — the daemon's
# first outbound HTTP call. Already a workspace dependency (both the root
# crate's `fleet_cli.rs` GET path and `darkmux-flow`'s hook-delivery POST
# side, #2093); promoted to direct here for the same reason #2093 promoted
# it into `darkmux-flow` — already resolved in Cargo.lock, no new version.
# `default-features = false` matches both existing usages: plain HTTP/1.1 +
# timeouts, no TLS/gzip surface needed to reach a peer over the tailnet.
ureq = { version = "2.10", default-features = false }
# (#2916 review M1) The fleet listener serves each connection itself so it
# can cap connections and bound header reads (`axum::serve` has neither).
# Both are already in the tree under axum; named directly for the API.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1", "service"] }
# (#2916 review M1) Raise RLIMIT_NOFILE's soft limit at daemon start.
libc = "0.2"

[features]
# (#2916 stage 2) Test-only: lets the fleet listener bind the loopback
# address a fake identity tool reports, so `tests/fleet_profile_address_two_daemons.rs`
# can run two daemons on one machine. Enabled only by that test target's
# `required-features` (through the root crate's feature of the same name);
# never by a release build. See `fleet_listener::LOOPBACK_FOR_E2E`.
e2e-fleet-loopback = []

[dev-dependencies]
serial_test = "3.1"
tower = "0.5"
# (UI port Packet 1) TS-bridge generator for the /runs view-model — dev-only,
# derive gated `#[cfg(test)]` in runs.rs so it never touches the release
# binary. Regenerate: `cargo test -p darkmux-serve export_bindings --lib`
# (or the ui/ package.json's `types:check` script, which runs the same
# command and diffs the result).
ts-rs = "10"
# (#811) Enable darkmux-types' test-support in serve's TEST build only so the
# config tier is empty by construction — the flow-endpoint tests never
# aggregate from the operator's real config.json Redis. Feature-unifies with
# the normal dep above; off in the release binary (dev-dependency only).
darkmux-types = { path = "../darkmux-types", features = ["test-support"] }
# (#2301) The typed step-output structs export their TypeScript from the
# SAME `export_bindings` test run the view-model types already use. Dev-dep
# only, so the release binary never pulls `ts-rs` through these crates.
darkmux-crew = { path = "../darkmux-crew", features = ["ts-export", "test-support"] }
darkmux-lab = { path = "../darkmux-lab", features = ["ts-export"] }
# (#2916) The fake identity provider the fleet listener's HTTP tests use.
darkmux-fleet = { path = "../darkmux-fleet", features = ["test-support"] }
