[package]
name = "darkmux-fleet"
version = "4.0.0-rc.1"
edition = "2021"
description = "darkmux fleet — roster/topology, secure work submission between machines, and dispatch routing"
license = "MIT"
homepage = "https://darkmux.com"
repository = "https://github.com/kstrat2001/darkmux"
authors = ["Kain Osterholt"]
rust-version = "1.86"

[dependencies]
darkmux-types = { path = "../darkmux-types" }
darkmux-flow = { path = "../darkmux-flow" }
darkmux-crew = { path = "../darkmux-crew" }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json.workspace = true
# The wire shapes derive a JSON Schema, hashed by the freeze test (tests/work_wire_fixtures.rs).
schemars = "1.2"
# (#2916) The profile registry, for resolving a submitted job's profile
# against this machine's own registry before the scope check.
darkmux-profiles = { path = "../darkmux-profiles" }
# (#2916) The sender's side of work submission: one POST to the target's
# fleet listener. Already a workspace dependency (root crate, darkmux-flow,
# darkmux-serve); same plain-HTTP, no-TLS feature set.
ureq = { version = "2.10", default-features = false }

[features]
# (#2916) `StaticIdentityProvider` + `test_node`, for other crates' tests
# (darkmux-serve's listener tests). No config value builds one.
test-support = []

[dev-dependencies]
blake3 = "1.5"
tempfile = "3.10"
serial_test = "3.1"
# (#811) Empty the config tier by construction in this crate's TEST build so
# tests never read the operator's real ~/.darkmux/config.json (e.g. fleet_file /
# redis_stream resolution). Dev-dep only; off in the release binary.
darkmux-types = { path = "../darkmux-types", features = ["test-support"] }
