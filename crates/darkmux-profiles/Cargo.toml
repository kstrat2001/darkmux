[package]
name = "darkmux-profiles"
version = "4.0.0-rc.1"
edition = "2021"
description = "darkmux profile registry + LMStudio stack-swap orchestration"
license = "MIT"
homepage = "https://darkmux.com"
repository = "https://github.com/kstrat2001/darkmux"
authors = ["Kain Osterholt"]
rust-version = "1.86"

[features]
# (#2632 CONSIDER 3) Mirrors `darkmux-types`'s own `test-support` feature —
# forwarded straight through so a DEPENDENT crate (darkmux-crew) can enable
# it as a dev-dependency and get the #2632 env-read audit's `audit_env_read`
# calls compiled into `profiles.rs`'s own `DARKMUX_HOME`/`DARKMUX_PROFILES`
# reads even when darkmux-profiles itself is linked as crew's NORMAL
# (non-test) dependency. Off in the release binary — never enabled outside
# a dev-dependency declaration.
test-support = ["darkmux-types/test-support"]
# TypeScript bindings for the memory ledger `/machine/resources` serves,
# generated by the `export_bindings` tests. Off in every normal build.
ts-export = ["dep:ts-rs", "darkmux-types/ts-export"]

[dependencies]
ts-rs = { version = "10", optional = true }
darkmux-types = { path = "../darkmux-types" }
# (#1274 packet 2b) The gestalt port traits + fact types the `gestalt_host`
# adapters implement. No cycle: darkmux-gestalt depends only on darkmux-types.
darkmux-gestalt = { path = "../darkmux-gestalt" }
anyhow = "1.0"
# (#1286) Serialize derives for the memory-ledger payload (ONE struct feeds
# both `darkmux machine resources --json` and the serve daemon's
# /machine/resources).
# Already throughout the workspace dependency tree — not a new external dep.
serde = { version = "1.0", features = ["derive"] }
# The `--json` contract golden derives its field schemas from the output types.
schemars = "1.2"
serde_json.workspace = true
dirs = "5.0"

[dev-dependencies]
tempfile = "3.10"
serial_test = "3.1"
# (#811) Empty the config tier by construction in this crate's TEST build so
# tests never read the operator's real ~/.darkmux/config.json (e.g. lms_bin
# resolution). Dev-dep only; off in the release binary.
darkmux-types = { path = "../darkmux-types", features = ["test-support"] }
