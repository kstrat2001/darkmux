[package]
name = "darkmux-heuristics"
version = "4.0.0-rc.1"
edition = "2021"
description = "darkmux per-tier heuristic profiles (M-series + generic)"
license = "MIT"
homepage = "https://darkmux.com"
repository = "https://github.com/kstrat2001/darkmux"
authors = ["Kain Osterholt"]
rust-version = "1.86"

[dependencies]
darkmux-hardware = { path = "../darkmux-hardware" }
darkmux-profiles = { path = "../darkmux-profiles" }
serde = { version = "1.0", features = ["derive"] }
# The CLI `--json` golden derives its field schemas from the output types.
schemars = "1.2"
serde_json.workspace = true

[dev-dependencies]
# `a_drafted_profile_has_no_unknown_keys` runs the unknown-key gate.
darkmux-types = { path = "../darkmux-types" }
tempfile = "3.10"
