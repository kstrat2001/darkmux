[package]
name = "darkmux-crew"
version = "3.6.0"
edition = "2021"
description = "darkmux crew — Role/Crew/Mission/Phase schema, loaders, dispatch, and the SQLite-derived index"
license = "MIT"
homepage = "https://darkmux.com"
repository = "https://github.com/kstrat2001/darkmux"
authors = ["Kain Osterholt"]
rust-version = "1.80"

[dependencies]
darkmux-types = { path = "../darkmux-types" }
darkmux-flow = { path = "../darkmux-flow" }
darkmux-profiles = { path = "../darkmux-profiles" }
# (#1230 Packet 1) The bounded concurrent-dispatch executor
# (concurrent_dispatch.rs) calls gestalt's pure `plan_waves` once up front to
# partition local jobs into co-resident-safe waves before executing them.
darkmux-gestalt = { path = "../darkmux-gestalt" }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
# (#2265) Mod keys are MINTED per mod with the same token scheme
# `mission_launch::mint_run_id` uses — a blake3 digest over (nanos, pid, an
# in-process counter) — so two mods minted in the same second are distinct.
# Already in the lockfile at this version (darkmux-flow, darkmux-lab and the
# runtime each depend on it directly); this adds no new transitive surface.
blake3 = "1.5"
# Phase B (#45) — SQLite-backed derived index over crew manifests.
rusqlite = { version = "0.31", features = ["bundled"] }
# (#2301) Optional, off by default — see the `ts-export` feature below.
ts-rs = { version = "10", optional = true }
# (#2310 P4c-2b PR #2357 review MUST FIX A) `mods.gate`'s scratch checkout
# for applying a mod's kit before its gate command runs — moved from
# dev-only here, same precedent `darkmux-serve` already sets (its own
# `[dependencies]` `tempfile`) for a crate that needs scratch dirs at
# runtime, not only in tests. No new transitive surface: already in the
# lockfile at this version via every other workspace member.
tempfile = "3.10"

[dev-dependencies]
serial_test = "3.1"
# (#1698 Packet B) In-process HTTP mock server for
# `tests/mock_single_shot_proof.rs` — the SAME crate + version `runtime/`'s
# own compaction-loop tests and `tools/darkmux-mock-model` already depend
# on, here used in its plain (non-standalone) in-process mode: no
# subprocess, no port-polling — `MockServer::start()` returns ready
# synchronously. Dev-dep only; never in the release binary.
httpmock = "0.7"
# (#811) Empty the config tier by construction in crew's TEST build so the
# inactivity-timeout default-assertion tests assert the built-in 600, not the
# operator's real runtime.inactivity_timeout_seconds. Dev-dep only; off in the
# release binary.
darkmux-types = { path = "../darkmux-types", features = ["test-support"] }

# (#2108) The host probe's mach kernel-counter reads (`host_processor_info`,
# `host_statistics64`, `sysctlbyname`) and its `dlopen`/`dlsym` of the PRIVATE
# IOReport framework. Already in the lockfile transitively at this version —
# this promotes it to a direct dependency, and it is the ONLY new dependency
# #2108 adds. CoreFoundation and IOKit are PUBLIC system frameworks present on
# every macOS install and are linked directly from inside the probe's own
# `cfg(all(target_os = "macos", target_arch = "aarch64"))` modules, so no
# other target sees either the crate or the frameworks.
# (#2310 swarm D) `bounded_command` runs every step command in its own process
# group (`setpgid`) and kills the group on deadline/interrupt (`kill(-pgid)`),
# on every Unix darkmux supports — so libc is a `cfg(unix)` dependency now, not
# macOS-only. Windows is unsupported (the flow audit sink is POSIX-only too).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# (#2301) TypeScript export for the typed step-output structs — the drift
# guard the viewer's generated types already are. Dev-only by construction:
# `darkmux-serve`'s DEV-dependency enables it for `cargo test -p
# darkmux-serve export_bindings --lib`, and cargo does not unify a dev-dep's
# features into a normal dependency, so the release binary never pulls
# `ts-rs` in.
ts-export = ["dep:ts-rs"]
