# Pin the toolchain so CI cannot break overnight without a code change.
#
# WHY THIS EXISTS: every workflow used `dtolnay/rust-toolchain@stable`, which
# floats. A new clippy lint in ANY stable release turns CI red on a PR that
# changed nothing relevant — and the failure reads as "your PR broke it".
# Pinning makes a Rust upgrade its own deliberate PR, reviewed on its own,
# instead of an ambush attached to whoever pushed next.
#
# BUMPING: change `channel` here, push it alone, read what breaks. Do not
# fold a toolchain bump into a feature PR — the whole point is that the two
# failures stay distinguishable.
#
# NOTE this is the DEVELOPMENT toolchain, not the MSRV. `Cargo.toml`'s
# `rust-version` is the minimum darkmux claims to compile on; that claim is
# currently unverified (see #1793).

[toolchain]
channel = "1.97.0"
components = ["clippy", "rustfmt"]
