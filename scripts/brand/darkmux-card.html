  <!-- Two inputs, one output: the smallest arrangement that still SAYS
       multiplexer rather than just "a shape". The full mark's four channels
       do not survive this size, but the relation many-in/one-out does, and
       that relation is the whole idea.

       Geometry is symmetric on BOTH axes, which is what lets it sit square in
       a favicon slot:

         inputs   x  8..19   (11 units)
         body     x 19..45   (26 units)
         output   x 45..56   (11 units)   -> span 8..56, centre 32

       The output used to run 18 units against the inputs' 11. That reads as a
       tail rather than a counterpart, and pushed the whole mark left of the
       viewBox centre.

       Inputs sit 20 apart, not 14: closer together they merged into a double
       stroke below 32px instead of reading as two channels, and two channels
       IS the message. 20 also lands symmetric inside the body's 42-unit left
       edge — 11 clear above, 11 below. -->

  <path d="M8 42 L19 42" stroke="#c084fc" stroke-width="4.5" stroke-linecap="round" />
