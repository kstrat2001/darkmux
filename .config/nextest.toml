# cargo-nextest configuration.
#
# Added 2026-07-29 after two tests HUNG the darkmux-serve binary rather than
# failing: one pointed DARKMUX_REDIS_URL (process-global) at a listener that
# accepted and never answered, so concurrently-running tests blocked too; the
# other blocked inside redis-rs's connection handshake. Under libtest they
# simply sat there and a 6s suite ran past 10 minutes with no signal.
#
# The goal is ONLY to convert an infinite hang into a loud failure. It is not
# a performance budget.

[profile.default]
# Tuned from evidence, not guessed. A first attempt at 30s/terminate-after-2
# (60s) FAILED the workspace: nextest runs each test in its own process at
# CPU-count parallelism, and `slow-timeout` is WALL CLOCK — so on a saturated
# machine (2612 tests, plus LMStudio resident and the serve daemon running)
# microsecond tests like darkmux-hardware's parsers sat in the run queue and
# were terminated at 60s. Those same tests pass in 0.028s when their crate
# runs alone.
#
# 60s warn / 300s terminate: a genuine hang is INFINITE, so 5 minutes still
# catches it decisively, while never firing on scheduling delay. The slowest
# legitimate test in this workspace is ~4.5s (the Redis tail backoff tests).
slow-timeout = { period = "60s", terminate-after = 5 }

# Don't let one failure hide the rest. The first run skipped 1097 tests after
# an early failure, which made the report useless for deciding whether the
# failure was isolated or systemic.
fail-fast = false

# Surface flakes instead of hiding them. #1544 (dispatch_internal
# handle_event_* / flow-record-sink pollution) is a KNOWN intermittent that
# made a release gate report green on luck. A retry marks it FLAKY in the
# summary rather than failing the run — but it is still reported, so it can't
# quietly become the norm.
retries = 1

# Print the slowest tests so creeping slowness is visible before it bites.
final-status-level = "slow"

# (#3134) Quiet by default: the binaries run 900-2,400 tests each, and a PASS
# line per test was thousands of lines that every reader (an agent above all)
# paid for and needed none of. A run now prints a line only for a test that
# failed, retried or ran slow, then the summary; a failing test's captured
# output comes once, at the end. `ci` inherits all three. `--status-level
# pass` on the command line brings the per-test lines back.
status-level = "retry"
success-output = "never"
failure-output = "final"

[profile.ci]
# CI is the ship gate: no retries, so a flake fails the build instead of being
# papered over. Same hang protection, same no-fail-fast reporting.
slow-timeout = { period = "60s", terminate-after = 5 }
retries = 0
fail-fast = false

[profile.mutants]
# Used by cargo-mutants (`--test-tool nextest` in quality.yml's mutation jobs),
# where every test run answers one question: does ANY test fail against this
# mutant? So it stops at the first failure (`fail-fast`): one failing test
# already catches the mutant, and running the rest of the suite after it only
# costs time, once per caught mutant. One retry, so a flaky test has to fail
# twice to count as catching a mutant, and cannot fail the unmutated baseline
# on its own. The ship gate's flake policy is the `ci` profile's, not this.
#
# The per-test kill is 6 x 60s, one period LONGER than cargo-mutants' own
# `--timeout 300` on the whole test run, so a mutant that hangs a test is
# stopped by cargo-mutants and reported TIMEOUT (not adjudicated) rather than
# killed here first and miscounted as caught. A plain hang is still bounded.
slow-timeout = { period = "60s", terminate-after = 6 }
retries = 1
fail-fast = true
